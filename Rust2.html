<script>
const data=[{"id": 1, "question": "1. Порядок установки и ввода в эксплуатацию средств защиты информации в компьютерных сетях?", "answer": "Установка и ввод в эксплуатацию средств защиты информации (СЗИ) в компьютерных сетях выполняются строго по эксплуатационной документации и проекту: проверка комплектности и целостности СЗИ, установка на аттестованные объекты, настройка политик безопасности, тестирование функций защиты, обучение персонала. Затем проводятся опытная эксплуатация, оценка соответствия требованиям безопасности и оформление акта ввода в эксплуатацию. Ключевые принципы: соответствие СЗИ требованиям ФСТЭК/ФСБ и наличие сертификатов, недопустимость снижения защищенности при вводе, документирование всех настроек, разграничение прав администраторов, плановое техническое обслуживание после ввода. Проверяемая опора ответа — ГОСТ Р 51583-2014: порядок создания АС в защищенном исполнении, включая ввод в действие и аттестацию.", "topic": "Тема 2.6.1. Порядок установки и ввода в эксплуатацию средств защиты информации в компьютерных сетях. Принципы основных методов организации и проведения технического обслуживания вычислительной техники и других технических средств информатизации", "sources": [["ГОСТ Р 51583-2014 «Защита информации. Порядок создания автоматизированных систем в защищенном исполнении» (действующий)", "https://base.garant.ru/70795270/"]]}, {"id": 2, "question": "2. Понятие уязвимости угрозы?", "answer": "Уязвимость — это недостаток (слабость) системы, который может быть использован для нарушения ее безопасности: ошибки ПО, неверные настройки, отсутствие обновлений, человеческий фактор. Угроза — это потенциальная возможность нарушения конфиденциальности, целостности или доступности информации через реализацию уязвимости. Уязвимости классифицируют по месту возникновения (программные, аппаратные, организационные), по опасности и по возможности устранения. Угрозы делят по источнику (внешние/внутренние), по намеренности (случайные/преднамеренные) и по объекту воздействия. Понимание пары «угроза — уязвимость» лежит в основе моделирования угроз. Проверяемая опора ответа — Методика оценки угроз безопасности информации ФСТЭК России от 05.02.2021: порядок выявления угроз, описание уязвимостей, нарушителей и сценариев.", "topic": "Тема 1.3.3. Понятие уязвимости угрозы. Классификация уязвимостей", "sources": [["Методика оценки угроз безопасности информации, ФСТЭК России, 05.02.2021 (действующая)", "https://garant.ru/products/ipo/prime/doc/400325044/"]]}, {"id": 3, "question": "3. Требования к автоматизированной системе в защищенном исполнении?", "answer": "Автоматизированная система в защищенном исполнении должна удовлетворять требованиям безопасности на всех стадиях жизненного цикла: от технического задания и проектирования до внедрения, эксплуатации и снятия с эксплуатации. Требования включают разграничение доступа, регистрацию событий, контроль целостности, защиту от НСД, антивирусную защиту и документирование. Работы на стадиях создания: формирование требований безопасности в ТЗ, проектирование подсистемы защиты, разработка и тестирование, аттестация объекта информатизации, ввод в действие с оформлением эксплуатационных документов. Проверяемая опора ответа — ГОСТ Р 51583-2014: требования к АС в защищенном исполнении и работы на стадиях ее создания.", "topic": "Тема 1.2.4. Требования к автоматизированной системе в защищенном исполнении. Работы на стадиях и этапах создания автоматизированных систем в защищенном исполнении. Требования по защите сведений о создаваемой автоматизированной системе.", "sources": [["ГОСТ Р 51583-2014 «Защита информации. Порядок создания автоматизированных систем в защищенном исполнении» (действующий)", "https://base.garant.ru/70795270/"]]}, {"id": 4, "question": "4. Обеспечение целостности информационной системы и информации?", "answer": "Целостность информационной системы и информации — это свойство сохранять точность, полноту и неизменность данных и конфигураций. Обеспечивается контролем целостности файлов и ПО (хеширование, электронная подпись), замкнутой программной средой, разграничением прав на изменение, журналированием изменений и резервным копированием. Дополнительно применяются антивирусная защита, контроль подключения носителей, регулярная сверка эталонных образов и мониторинг событий изменения критичных объектов. Нарушения целостности должны фиксироваться и расследоваться.", "topic": "Тема 2.5.6. Обеспечение целостности информационной системы и информации", "sources": [["Федеральный закон от 06.04.2011 № 63-ФЗ «Об электронной подписи» (действующий)", "https://rulaws.ru/laws/Federalnyy-zakon-ot-06.04.2011-N-63-FZ/"]]}, {"id": 5, "question": "5. Исследование эффективности проектных решений программно-аппаратных средств обеспечения защиты информации в автоматизированной системе?", "answer": "Исследование эффективности проектных решений программно-аппаратных средств защиты — это проверка того, что выбранные СЗИ реально обеспечивают требуемый уровень защищенности АС. Проводится анализом соответствия требованиям, тестированием функций защиты, испытанием устойчивости к типовым атакам и оценкой влияния на производительность системы. По итогам оформляются выводы: какие решения эффективны, что нужно доработать (настройки, дополнительные меры, замена средств). Это обязательный элемент обоснования проектных решений перед вводом системы в эксплуатацию. Стадии создания, порядок приемки и аттестации АС в защищенном исполнении заданы ГОСТ Р 51583-2014.", "topic": "Тема 2.5.9. Исследование эффективности проектных решений программно-аппаратных средств обеспечения защиты информации в автоматизированной системе с целью обеспечения требуемого уровня защищенности", "sources": [["ГОСТ Р 51583-2014 «Порядок создания автоматизированных систем в защищенном исполнении»", "https://base.garant.ru/70795270/"]]}, {"id": 6, "question": "6. Настройка и устранение неисправности программно-аппаратных средств защиты информации в компьютерных сетях по заданным правилам?", "answer": "Настройка программно-аппаратных СЗИ ведется по заданным правилам (политикам безопасности): установка параметров доступа, правил фильтрации, расписаний обновления баз, режимов журналирования. После настройки обязательно проверяется работоспособность каждой функции. При неисправностях выполняется диагностика: анализ журналов, проверка совместимости версий и конфликтов ПО, тестирование компонентов, замена или переустановка, восстановление конфигурации из резервной копии. Все действия фиксируются в эксплуатационной документации.", "topic": "Тема 2.6.2. Диагностика компонентов систем защиты информации в автоматизированных системах, устранение отказов и восстановление работоспособности автоматизированных (информационных) систем в защищенном исполнении. Настройка и устранение неисправности программно-аппаратных средств защиты информации в компьютерных сетях по заданным правилам", "sources": [["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"]]}, {"id": 7, "question": "7. Содержание и порядок деятельности персонала по эксплуатации защищенных автоматизированных систем и подсистем безопасности автоматизированных систем?", "answer": "Эксплуатация защищенных АС требует четкого распределения ролей: администратор безопасности, администратор системы, пользователи. Персонал обязан соблюдать инструкции, режим доступа, правила работы с носителями и паролями, порядок реагирования на инциденты. Деятельность включает плановые проверки состояния защиты, контроль журналов, обновление СЗИ, инструктаж пользователей, ведение документации. Ответственность каждого фиксируется в должностных инструкциях и организационно-распорядительных документах.", "topic": "Тема 2.3.1. Содержание и порядок деятельности персонала по эксплуатации защищенных автоматизированных систем и подсистем безопасности автоматизированных систем. Общие обязанности администратора информационной безопасности автоматизированных систем", "sources": [["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"]]}, {"id": 8, "question": "8. Анализ информационной инфраструктуры автоматизированной системы и ее безопасности?", "answer": "Анализ информационной инфраструктуры АС — это инвентаризация и описание всех компонентов: серверы, рабочие станции, сеть, ПО, информационные потоки, точки подключения внешних сетей, категории обрабатываемой информации. Затем оценивается, где находятся критичные активы и какие угрозы им соответствуют. Результат анализа — карта инфраструктуры с выявленными слабыми местами, которая служит основой для модели угроз, выбора мер защиты и планирования модернизации. Анализ инфраструктуры выполняется на стадии обследования при создании АС в защищенном исполнении; порядок стадий задан ГОСТ Р 51583-2014.", "topic": "Тема 2.1.1. Анализ информационной инфраструктуры автоматизированной системы и ее безопасности", "sources": [["Федеральный закон от 27.07.2006 № 149-ФЗ «Об информации, информационных технологиях и о защите информации» (действующий)", "https://rulaws.ru/laws/Federalnyy-zakon-ot-27.07.2006-N-149-FZ/"], ["ГОСТ Р 51583-2014 «Защита информации. Порядок создания автоматизированных систем в защищенном исполнении» (действующий)", "https://base.garant.ru/70795270/"]]}, {"id": 9, "question": "9. Контроль печати?", "answer": "Контроль печати — это учет и ограничение вывода конфиденциальных документов на принтеры: авторизация печати, маркировка документов, запрет печати на несогласованных устройствах, журналирование заданий (кто, когда, какой документ, на какой принтер). Технически реализуется средствами СЗИ (контроль устройств, регламентация драйверов принтеров), организационными мерами (перечень разрешенных принтеров, ответственные лица) и регулярной проверкой журналов. Цель — исключить неконтролируемое размножение конфиденциальных документов. Обращение распечатанных конфиденциальных документов подчиняется установленному режиму конфиденциальности: для коммерческой тайны закон № 98-ФЗ требует определить перечень сведений, ограничить доступ, вести учет лиц и наносить гриф. Требование маркирования документов при выводе на печать закреплено в мере ОД.8 методдокумента ФСТЭК (2026).", "topic": "Тема 2.5.5. Использование принтеров для печати конфиденциальных документов. Контроль печати", "sources": [["Федеральный закон от 29.07.2004 № 98-ФЗ «О коммерческой тайне» (действующий)", "https://rulaws.ru/laws/Federalnyy-zakon-ot-29.07.2004-N-98-FZ/"], ["Методдокумент ФСТЭК от 12.04.2026 «Состав и содержание мероприятий и мер по обеспечению защиты информации»", "https://base.garant.ru/414070697/"]]}, {"id": 10, "question": "10. Обнаружение (предотвращение) вторжений?", "answer": "Обнаружение вторжений — это выявление попыток НСД и атак с помощью систем обнаружения/предотвращения вторжений (СОВ/СОП), анализа журналов, контроля сетевого трафика и поведения. Предотвращение — автоматическая блокировка вредоносных соединений, изоляция узлов, обновление сигнатур и правил. Смежные задачи: контроль защищенности (сканирование уязвимостей, проверка конфигураций), обеспечение целостности (контроль изменений критичных файлов) и доступности информации (резервирование, защита от DoS). Все события должны регистрироваться и анализироваться.", "topic": "Тема 1.5.3. Обнаружение (предотвращение) вторжений. Контроль (анализ) защищенности информации. Обеспечение целостности информационной системы и информации. Обеспечение доступности информации", "sources": [["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"]]}, {"id": 11, "question": "11. Идентификация и аутентификация субъектов доступа и объектов доступа?", "answer": "Идентификация — предъявление идентификатора (имя пользователя, токен), аутентификация — проверка подлинности (пароль, биометрия, сертификат). Только после успешной аутентификации субъект получает доступ к объектам строго в пределах своих прав. Управление доступом включает матрицы и ролевые модели прав, ограничение программной среды (запрет запуска неразрешенного ПО), защиту машинных носителей от несанкционированного чтения и копирования. Рекомендуется многофакторная аутентификация для привилегированных учетных записей.", "topic": "Тема 1.5.1. Идентификация и аутентификация субъектов доступа и объектов доступа. Управление доступом субъектов доступа к объектам доступа. Ограничение программной среды. Защита машинных носителей информации", "sources": [["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"]]}, {"id": 12, "question": "12. Основные принципы защиты от НСД?", "answer": "Основные принципы защиты от несанкционированного доступа (НСД): комплексность (перекрытие всех каналов), эшелонированность (несколько рубежей), минимальные привилегии, разграничение доступа, непрерывный контроль, подотчетность действий (журналирование), простота управления. Направления обеспечения: правовое, организационное, программно-аппаратное, инженерно-техническое. Технические средства защиты оцениваются по функциональности, надежности, наличию сертификации и совместимости с системой. Проверяемая опора ответа — РД Гостехкомиссии России по защите АС от НСД (1992, исторический): принципы, направления и организация защиты от НСД.", "topic": "Тема 2.4.1. Основные принципы защиты от НСД. Основные способы НСД. Основные направления обеспечения защиты от НСД. Основные характеристики технических средств защиты от НСД. Организация работ по защите от НСД", "sources": [["РД. Автоматизированные системы. Защита от НСД. Классификация АС и требования по защите информации, Гостехкомиссия России, 1992 (исторический документ)", "https://base.garant.ru/197886/"]]}, {"id": 13, "question": "13. Основные способы НСД?", "answer": "Основные способы НСД: подбор и кража учетных данных, использование уязвимостей ПО и неверных настроек, перехват данных в сети, установка вредоносного ПО, подключение неразрешенных устройств и носителей, превышение полномочий легальными пользователями, социальная инженерия. Защита строится по направлениям: предотвращение (контроль доступа, обновления), обнаружение (мониторинг, аудит) и реагирование (блокировка, восстановление). Для каждого способа подбираются соответствующие технические и организационные меры. Проверяемая опора ответа — Методика оценки угроз ФСТЭК от 05.02.2021: нарушители, способы и сценарии реализации угроз.", "topic": "Тема 2.4.1. Основные принципы защиты от НСД. Основные способы НСД. Основные направления обеспечения защиты от НСД. Основные характеристики технических средств защиты от НСД. Организация работ по защите от НСД", "sources": [["Методика оценки угроз безопасности информации, ФСТЭК России, 05.02.2021 (действующая)", "https://garant.ru/products/ipo/prime/doc/400325044/"]]}, {"id": 14, "question": "14. Понятие жизненного цикла АИС?", "answer": "Жизненный цикл АИС — это совокупность стадий от замысла до снятия с эксплуатации: формирование требований, проектирование, разработка, ввод в действие, эксплуатация, сопровождение и вывод из эксплуатации. Процессы делят на основные (разработка, эксплуатация), вспомогательные (документирование, тестирование) и организационные (управление проектом). Классическая отечественная схема стадий закреплена в ГОСТ 34.601-90. Важно: стандарт утратил силу в РФ и используется как исторический ориентир, а действующие требования к защите задаются приказами ФСТЭК (с 01.03.2026 — приказом № 117 вместо № 17). Действующий документ по стадиям создания АС — ГОСТ Р 59793-2021 (введен с 30.06.2022); схема ГОСТ 34.601-90 — исторический ориентир.", "topic": "Тема 1.2.1. Понятие жизненного цикла АИС. Процессы жизненного цикла АИС: основные, вспомогательные, организационные. Стадии жизненного цикла АИС: моделирование, управление требованиями, анализ и проектирование, установка и сопровождение. Модели жизненного цикла АИС.", "sources": [["ГОСТ Р 59793-2021 «Защита информации. Создание автоматизированных систем в защищенном исполнении. Стадии создания» (действующий с 30.06.2022)", "https://base.garant.ru/404733099/"], ["ГОСТ 34.601-90 «Автоматизированные системы. Стадии создания» (утратил силу в РФ, исторический ориентир)", "https://base.garant.ru/187735/"]]}, {"id": 15, "question": "15. Требования защищенности СВТ от НСД к информации?", "answer": "Требования защищенности средств вычислительной техники (СВТ) от НСД определяют классы защиты в зависимости от конфиденциальности обрабатываемой информации: чем выше уровень конфиденциальности, тем строже требования к разграничению доступа, регистрации, контролю целостности и изоляции. Дополнительно нормируются требования к средствам защиты межсетевого взаимодействия: управление потоками между сетями, фильтрация, контроль соединений, регистрация событий. Конкретные наборы мер выбираются по классу защищенности и модели угроз. Проверяемая опора ответа — РД Гостехкомиссии по СВТ (1992, исторический): классы защищенности СВТ с 6-го по 1-й и показатели защищенности.", "topic": "Тема 2.4.3. Требования защищенности СВТ от НСД к информации. Требования к средствам защиты, обеспечивающим безопасное взаимодействие сетей ЭВМ, АС посредством управления межсетевыми потоками информации, и реализованных в виде МЭ", "sources": [["РД. Средства вычислительной техники. Защита от НСД. Показатели защищенности, Гостехкомиссия России, 1992 (исторический документ)", "https://base.garant.ru/197885/"]]}, {"id": 16, "question": "16. Требования по защите информации от НСД для АС?", "answer": "Автоматизированные системы классифицируются по составу и масштабу (одномашинные, сетевые, распределенные), по уровню конфиденциальности информации и по режиму обработки. Класс защищенности АС определяет набор обязательных требований: идентификация и аутентификация, управление доступом, регистрация событий, контроль целостности, антивирусная защита. Требования реализуются комплексом СЗИ и организационных мер, а соответствие подтверждается аттестацией. Актуальные составы мер следует сверять с действующим приказом ФСТЭК № 117 (вступил в силу 01.03.2026). Проверяемая опора ответа — РД Гостехкомиссии по защите АС от НСД (1992, исторический): классы защищенности АС (группы 3, 2, 1) и требования для каждого класса.", "topic": "Тема 2.4.2. Классификация автоматизированных систем. Требования по защите информации от НСД для АС", "sources": [["РД. Автоматизированные системы. Защита от НСД. Классификация АС и требования по защите информации, Гостехкомиссия России, 1992 (исторический документ)", "https://base.garant.ru/197886/"], ["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"]]}, {"id": 17, "question": "17. Отличительные черты АИС наиболее часто используемых классификаций?", "answer": "АИС классифицируют: по масштабу (локальные, корпоративные, территориально-распределенные, глобальные); по характеру ресурсов (управленческие, информационно-справочные, расчетные, геоинформационные); по режиму обработки (пакетные, диалоговые, реального времени); по назначению (государственные, отраслевые, коммерческие). Отличительные черты каждой категории — объем и критичность данных, число пользователей, требования к доступности и защите. Классификация нужна, чтобы правильно выбрать архитектуру, меры защиты и порядок эксплуатации.", "topic": "Тема 1.1.1. Понятие автоматизированной (информационной) системы. Отличительные черты АИС наиболее часто используемых классификаций: по масштабу, в зависимости от характера информационных ресурсов, по технологии обработки данных, по способу доступа, в зависимости от организации системы, по характеру использования информации, по сфере применения.", "sources": [["Федеральный закон от 27.07.2006 № 149-ФЗ «Об информации, информационных технологиях и о защите информации» (действующий)", "https://rulaws.ru/laws/Federalnyy-zakon-ot-27.07.2006-N-149-FZ/"]]}, {"id": 18, "question": "18. Определения уровня защищенности ИСПДн и выбор мер по обеспечению безопасности ПДн?", "answer": "Уровень защищенности ИСПДн (УЗ-1 — УЗ-4) определяется по трем факторам: тип актуальных угроз, категория обрабатываемых персональных данных и количество субъектов. Чем выше риски и чувствительность данных, тем выше уровень (УЗ-1 — максимальный). По установленному уровню выбираются меры: состав организационных и технических мер, необходимость сертифицированных СЗИ, шифрования, межсетевого экранирования. Порядок действий: определить уровень защищенности, выбрать базовый набор мер, адаптировать его под угрозы, задокументировать и внедрить. Действующая база — ПП № 1119 и закон № 152-ФЗ.", "topic": "Тема 1.7.2. Определения уровня защищенности ИСПДн и выбор мер по обеспечению безопасности ПДн.", "sources": [["Постановление Правительства РФ от 01.11.2012 № 1119 (действующее)", "https://base.garant.ru/70252506/"], ["Федеральный закон от 27.07.2006 № 152-ФЗ «О персональных данных» (действующий)", "https://base.garant.ru/12148567/"]]}, {"id": 19, "question": "19. Регистрация событий безопасности?", "answer": "Регистрация событий безопасности — это фиксация в журналах всех значимых действий: входы в систему, изменения прав, доступ к защищаемым ресурсам, срабатывания СЗИ, обновления. Журналы должны быть защищены от подделки и регулярно анализироваться. Антивирусная защита включает установку антивирусных средств, регулярное обновление баз, сканирование по расписанию и при доступе, изоляцию зараженных объектов. Признаки заражения: аномальная активность, изменение файлов, срабатывания эвристики — требуют немедленного реагирования.", "topic": "Тема 1.5.2. Регистрация событий безопасности. Антивирусная защита. Обнаружение признаков наличия вредоносного программного обеспечения. Реализация антивирусной защиты. Обновление баз антивирусной защиты", "sources": [["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"]]}, {"id": 20, "question": "20. Архитектура механизмов защиты распределенных автоматизированных систем?", "answer": "Защита распределенных АС строится эшелонированно: защита узлов (контроль доступа, целостность, антивирусы), защита каналов (сегментация сети, межсетевое экранирование), защита периметра (межсетевые экраны, СОВ), согласованное управление политиками и мониторинг. Архитектура механизмов защиты включает подсистемы идентификации, управления доступом, регистрации, контроля целостности и восстановления. При проектировании учитывают топологию сети, доверие между сегментами и единый контур управления безопасностью.", "topic": "Тема 1.6.1. Механизмы и методы защиты информации в распределенных автоматизированных системах. Архитектура механизмов защиты распределенных автоматизированных систем. Анализ и синтез структурных и функциональных схем защищенных автоматизированных систем", "sources": [["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"]]}, {"id": 21, "question": "21. Задачи и функции администрирования автоматизированных систем?", "answer": "Администрирование АС решает задачи: управление пользователями и правами, конфигурациями, производительностью, резервным копированием, обновлениями, безопасностью. Функции администратора — внедрение политик, мониторинг состояния, реагирование на инциденты, ведение документации. Управление сетью автоматизируется средствами мониторинга, инвентаризации и централизованного развертывания настроек. Работа административного персонала регламентируется инструкциями с разделением полномочий и подотчетностью действий.", "topic": "Тема 2.2.1. Задачи и функции администрирования автоматизированных систем. Автоматизация управления сетью. Организация администрирования автоматизированных систем. Административный персонал и работа с пользователями. Управление, тестирование и эксплуатация автоматизированных систем. Методы, способы и средства обеспечения отказоустойчивости автоматизированных систем", "sources": [["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"]]}, {"id": 22, "question": "22. Методы мониторинга и аудита, выявления угроз информационной безопасности автоматизированных систем?", "answer": "Мониторинг — непрерывное наблюдение за состоянием безопасности: сбор событий, контроль конфигураций, отслеживание аномалий. Аудит — периодическая независимая проверка соответствия требованиям: анализ настроек, прав доступа, журналов, эффективности мер. Выявление угроз ведется сканированием уязвимостей, анализом журналов, контролем целостности и поведенческим анализом. Результаты фиксируются в отчетах, по ним устраняются нарушения и корректируются меры защиты.", "topic": "Тема 2.1.2. Методы мониторинга и аудита, выявления угроз информационной безопасности автоматизированных систем.", "sources": [["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"]]}, {"id": 23, "question": "23. Разграничение доступа к устройствам?", "answer": "Разграничение доступа к устройствам означает, что каждому пользователю разрешены только необходимые устройства и интерфейсы: USB-порты, принтеры, сетевые адаптеры, съемные носители. Подключение неразрешенных устройств блокируется технически. Управление доступом реализуется политиками СЗИ (белые списки устройств), физическим контролем портов и регистрацией всех подключений. Это закрывает один из самых частых каналов утечки и заражения — через носители и периферию.", "topic": "Тема 2.5.4. Защита входа в систему (идентификация и аутентификация пользователей). Разграничение доступа к устройствам. Управление доступом", "sources": [["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"]]}, {"id": 24, "question": "24. Работа с программным обеспечением с соблюдением действующих требований по защите информации?", "answer": "Работа с ПО должна вестись только с лицензионными и проверенными дистрибутивами, установка — из доверенных источников с контролем целостности. Запрещены несанкционированные программы, обход штатных механизмов защиты, отключение антивирусов и СЗИ. Действующие требования включают своевременное обновление ПО и устранение уязвимостей, удаление неиспользуемых сервисов, контроль изменений конфигураций и обучение пользователей безопасной работе. Нарушения фиксируются и разбираются. Требования унификации применяемого ПО и использования только разрешенного ПО заданы методдокументом ФСТЭК (2026), раздел 2.10.", "topic": "Тема 2.5.10. Работа с программным обеспечением с соблюдением действующих требований по защите информации", "sources": [["Методдокумент ФСТЭК от 12.04.2026 «Состав и содержание мероприятий и мер по обеспечению защиты информации»", "https://base.garant.ru/414070697/"]]}, {"id": 25, "question": "25. Потенциальные угрозы безопасности в автоматизированных системах?", "answer": "Потенциальные угрозы безопасности в АС — это все возможные сценарии нарушения конфиденциальности, целостности и доступности: НСД, вредоносное ПО, утечки, сбои, ошибки персонала, стихийные воздействия. Источники угроз: внешние нарушители, инсайдеры, техника, среда. Объекты воздействия — информация, ПО, технические средства, персонал, инфраструктура. Угрозы классифицируют по источнику, намеренности и последствиям, а опасность оценивают по вероятности реализации и размеру ущерба — это основа модели угроз. Проверяемая опора ответа — Методика оценки угроз ФСТЭК от 05.02.2021: источники угроз, объекты воздействия, оценка опасности.", "topic": "Тема 1.3.1. Потенциальные угрозы безопасности в автоматизированных системах. Источники и объекты воздействия угроз безопасности информации. Критерии классификации угроз. Методы оценки опасности угроз. Банк данных угроз безопасности информации", "sources": [["Методика оценки угроз безопасности информации, ФСТЭК России, 05.02.2021 (действующая)", "https://garant.ru/products/ipo/prime/doc/400325044/"]]}, {"id": 26, "question": "26. Централизованное управление системой защиты, оперативный мониторинг и аудит безопасности?", "answer": "Централизованное управление системой защиты — это единая точка задания политик, распространения настроек СЗИ, сбора событий и контроля исполнения. Оперативный мониторинг обеспечивает обнаружение инцидентов в реальном времени, а аудит безопасности — регулярную проверку соответствия и эффективности. Практически это реализуется консолью управления, SIEM-системами, регламентами реагирования и отчетностью. Преимущества: единообразие защиты, скорость реакции, прозрачность состояния безопасности всей АС.", "topic": "Тема 2.5.7. Централизованное управление системой защиты, оперативный мониторинг и аудит безопасности", "sources": [["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"]]}, {"id": 27, "question": "27. Резервное копирование и восстановление данных?", "answer": "Резервное копирование — регулярное создание копий данных и конфигураций по правилу (полные, инкрементные, дифференциальные копии) с хранением в отдельном месте, защищенном от тех же рисков, что и основная система. Копии должны проверяться восстановлением. Восстановление данных — регламентированная процедура возврата работоспособности после сбоя, атаки или ошибки: определение точки восстановления, развертывание копий, проверка целостности и возобновление работы. План восстановления тестируется заранее, а не во время аварии.", "topic": "Тема 1.5.5. Защита технических средств. Защита информационной системы, ее средств, систем связи и передачи данных. Резервное копирование и восстановление данных", "sources": [["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"]]}, {"id": 28, "question": "28. Разработка технического задания на создание подсистем информационной безопасности автоматизированных систем?", "answer": "Техническое задание на подсистему информационной безопасности АС определяет цели защиты, перечень защищаемых ресурсов, модель угроз и нарушителя, требования к мерам и СЗИ, порядок испытаний и приемки. Оно разрабатывается на основе обследования объекта и анализа рисков. ТЗ согласуется с заказчиком и служит основанием для проектирования: по нему выбирают конкретные средства, планируют работы и принимают результат. Требования ТЗ должны соответствовать действующим НПА, включая приказ ФСТЭК № 117. Проверяемая опора ответа — ГОСТ 34.602-2020: состав ТЗ на АС, включая требования к защите информации; для защищенного исполнения применяется совместно с ГОСТ Р 51583-2014.", "topic": "Тема 1.2.5. Разработка технического задания на создание подсистем информационной безопасности автоматизированных систем", "sources": [["ГОСТ 34.602-2020 «Информационные технологии. Техническое задание на создание автоматизированной системы» (действующий с 01.01.2022, взамен ГОСТ 34.602-89)", "https://base.garant.ru/403255670/"], ["ГОСТ Р 51583-2014 «Защита информации. Порядок создания автоматизированных систем в защищенном исполнении» (действующий)", "https://base.garant.ru/70795270/"]]}, {"id": 29, "question": "29. Электронный документооборот?", "answer": "Электронный документооборот — это создание, согласование, подписание, передача и хранение документов в электронной форме. Юридическая значимость электронных документов обеспечивается электронной подписью. По закону № 63-ФЗ различают простую, усиленную неквалифицированную и усиленную квалифицированную подписи; документ, подписанный квалифицированной подписью, равнозначен бумажному с собственноручной подписью (если законом не установлено иное). При внедрении СЭД важны идентификация участников, контроль целостности и долговременное хранение.", "topic": "Тема 1.1.3. Основные особенности современных проектов АИС. Электронный документооборот.", "sources": [["Федеральный закон от 06.04.2011 № 63-ФЗ «Об электронной подписи» (действующий)", "https://rulaws.ru/laws/Federalnyy-zakon-ot-06.04.2011-N-63-FZ/"]]}, {"id": 30, "question": "30. технические меры защиты информации в автоматизированных системах?", "answer": "Меры защиты информации в АС делятся на группы: организационные (регламенты, роли, обучение), правовые (договоры, ответственность), программно-аппаратные (СЗИ, контроль доступа, журналирование), криптографические (шифрование, электронная подпись) и технические (охрана помещений, экранирование, контроль побочных излучений). Эффективна только совокупность мер: техника без регламентов и обучения не работает. Состав мер подбирается по модели угроз и требованиям НПА, а их действие регулярно проверяется. Исчерпывающая таксономия мер (ИАФ, УПД, РСБ, ЗСВ, АВЗ, СОВ, МСЭ и другие) приведена в методдокументе ФСТЭК (2026).", "topic": "Тема 1.4.1. Организационные, правовые, программно-аппаратные, криптографические, технические меры защиты информации в автоматизированных системах", "sources": [["Федеральный закон от 27.07.2006 № 149-ФЗ «Об информации, информационных технологиях и о защите информации» (действующий)", "https://rulaws.ru/laws/Federalnyy-zakon-ot-27.07.2006-N-149-FZ/"], ["Методдокумент ФСТЭК от 12.04.2026 «Состав и содержание мероприятий и мер по обеспечению защиты информации»", "https://base.garant.ru/414070697/"]]}, {"id": 31, "question": "31. Основные эксплуатационные документы защищенных автоматизированных систем?", "answer": "Основные эксплуатационные документы защищенных АС: паспорт/формуляр системы, инструкции администратора безопасности и пользователей, регламенты резервного копирования и восстановления, журналы учета, акт ввода в эксплуатацию и аттестат соответствия (при аттестации). Документация разрабатывается при создании системы и ведется в ходе эксплуатации: фиксируются изменения конфигураций, инциденты, результаты проверок. Актуальные и полные документы — обязательное условие контролируемой и проверяемой эксплуатации. Проверяемая опора ответа — ГОСТ Р 59795-2021: состав эксплуатационной документации АС (формуляры, руководства, регламенты, журналы).", "topic": "Тема 2.7.1. Основные эксплуатационные документы защищенных автоматизированных систем. Разработка и ведение эксплуатационной документации защищенных автоматизированных систем. Акт ввода в эксплуатацию на автоматизированную систему. Технический паспорт на защищаемую автоматизированную систему.", "sources": [["ГОСТ Р 59795-2021 «Защита информации. Создание автоматизированных систем в защищенном исполнении. Эксплуатационная документация» (действующий)", "https://base.garant.ru/403358611/"]]}, {"id": 32, "question": "32. Нормативно-правовая база для определения мер защиты информации в автоматизированных информационных системах и требований к ним?", "answer": "Нормативно-правовая база защиты информации в АИС включает: федеральные законы № 149-ФЗ (информация и ее защита), № 152-ФЗ (персональные данные), № 63-ФЗ (электронная подпись), № 98-ФЗ (коммерческая тайна); постановления Правительства (в т.ч. № 1119 по защите ПДн); приказы ФСТЭК (с 01.03.2026 — № 117 вместо утратившего силу № 17; действуют № 21 по ИСПДн и № 239 по КИИ). Дополнительно применяются методические документы ФСТЭК, стандарты (в т.ч. исторические ГОСТ 34-й серии) и отраслевые НПА. Проверять актуальность НПА следует на 2026 год: отмененные документы нельзя выдавать за действующие.", "topic": "Тема 1.4.2. Нормативно-правовая база для определения мер защиты информации в автоматизированных информационных системах и требований к ним", "sources": [["Федеральный закон от 27.07.2006 № 149-ФЗ «Об информации, информационных технологиях и о защите информации» (действующий)", "https://rulaws.ru/laws/Federalnyy-zakon-ot-27.07.2006-N-149-FZ/"], ["Федеральный закон от 27.07.2006 № 152-ФЗ «О персональных данных» (действующий)", "https://base.garant.ru/12148567/"], ["Постановление Правительства РФ от 01.11.2012 № 1119 (действующее)", "https://base.garant.ru/70252506/"]]}, {"id": 33, "question": "33. Разработка технического задания на проектирование автоматизированной системы?", "answer": "Техническое задание на проектирование АС содержит: основание и назначение разработки, требования к функциям и характеристикам, к видам обеспечения (информационному, программному, техническому), порядок испытаний и приемки, требования к документации. Классическая структура ТЗ восходит к ГОСТ 34.602 и стадиям ГОСТ 34.601-90 (стандарт утратил силу в РФ и используется как учебный ориентир). ТЗ согласуется заказчиком и исполнителем и фиксирует границы проекта, сроки и критерии приемки. Проверяемая опора ответа — ГОСТ 34.602-2020: разделы ТЗ на создание АС и порядок его согласования.", "topic": "Тема 1.2.3. Разработка технического задания на проектирование автоматизированной системы", "sources": [["ГОСТ 34.602-2020 «Информационные технологии. Техническое задание на создание автоматизированной системы» (действующий с 01.01.2022, взамен ГОСТ 34.602-89)", "https://base.garant.ru/403255670/"]]}, {"id": 34, "question": "34. Порядок выбора мер по обеспечению безопасности персональных данных?", "answer": "Порядок выбора мер по обеспечению безопасности персональных данных: определить уровень защищенности ИСПДн (по ПП № 1119), выявить актуальные угрозы, выбрать базовый набор организационных и технических мер, адаптировать его под систему, внедрить и задокументировать. Меры включают контроль доступа, регистрацию событий, антивирусную защиту, контроль целостности, шифрование при необходимости, межсетевое экранирование. Эффективность выбранных мер периодически проверяется, состав корректируется при изменении угроз.", "topic": "Тема 1.7.1. Общие требования по защите персональных данных. Состав и содержание организационных и технических мер по защите информационных систем персональных данных. Порядок выбора мер по обеспечению безопасности персональных данных. Требования по защите персональных данных, в соответствии с уровнем защищенности", "sources": [["Постановление Правительства РФ от 01.11.2012 № 1119 (действующее)", "https://base.garant.ru/70252506/"], ["Федеральный закон от 27.07.2006 № 152-ФЗ «О персональных данных» (действующий)", "https://base.garant.ru/12148567/"]]}, {"id": 35, "question": "35. Настройка системы для задач аудита?", "answer": "Настройка системы для задач аудита — это включение и конфигурирование регистрации нужных событий (входы, изменения прав и конфигураций, доступ к критичным ресурсам), защита журналов от модификации, настройка их ротации и хранения, синхронизация времени на всех узлах. Дополнительно настраиваются контроль целостности (периодическая сверка эталонов) и замкнутая программная среда (запрет запуска неразрешенного ПО). Централизованный сбор журналов упрощает анализ и расследование инцидентов.", "topic": "Тема 2.5.8. Настройка системы для задач аудита. Настройка контроля целостности и замкнутой программной среды. Централизованное управление системой защиты, оперативный мониторинг и аудит безопасности", "sources": [["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"]]}, {"id": 36, "question": "36. Рассмотрение примеров функционирования автоматизированных информационных систем?", "answer": "Примеры функционирующих АИС: ЕГАИС — федеральная информационная система учета объема производства и оборота этилового спирта, алкогольной и спиртосодержащей продукции, созданная в соответствии с Федеральным законом № 171-ФЗ (определение — п. 30 ст. 2): учет каждой единицы через маркировку и сопроводительные документы; торговые системы (биржевые платформы с matching-движком, клирингом и высокой доступностью); корпоративные АИС компаний (ERP/CRM, документооборот). Общее у них: базы данных, распределенные пользователи, требования к достоверности, доступности и защите информации, интеграция с государственными реестрами и электронной подписью.", "topic": "Тема 1.1.4. Рассмотрение примеров функционирования автоматизированных информационных систем (ЕГАИС, Российская торговая система, автоматизированная информационная система компании)", "sources": [["Федеральный закон от 22.11.1995 № 171-ФЗ (ЕГАИС, п.30 ст.2; действующий)", "https://rulaws.ru/laws/Federalnyy-zakon-ot-22.11.1995-N-171-FZ/"]]}, {"id": 37, "question": "37. Технологии виртуализации?", "answer": "Виртуализация — технология запуска нескольких виртуальных машин на одном физическом сервере с помощью гипервизора. Цели: эффективное использование ресурсов, изоляция сред, быстрое развертывание и восстановление, отказоустойчивость. Задачи безопасности: защита гипервизора, изоляция ВМ друг от друга, контроль образов и снапшотов, сегментация виртуальных сетей, мониторинг. Преимущества — гибкость и экономия; риски — выход за пределы ВМ, компрометация гипервизора, неконтролируемое размножение образов. Меры ЗСВ.1–ЗСВ.9 методдокумента ФСТЭК (2026): доверенная загрузка среды виртуализации, контроль целостности, управление виртуальными машинами, резервное копирование в среде виртуализации.", "topic": "Тема 1.5.4. Технологии виртуализации. Цель создания. Задачи, архитектура и основные функции. Преимущества от внедрения. Управление рисками и инцидентами управления безопасностью и сопровождение автоматизированных систем.", "sources": [["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"], ["Методдокумент ФСТЭК от 12.04.2026 «Состав и содержание мероприятий и мер по обеспечению защиты информации»", "https://base.garant.ru/414070697/"]]}, {"id": 38, "question": "38. Содержание и порядок выполнения работ по защите информации при модернизации автоматизированной системы в защищенном исполнении?", "answer": "Модернизация защищенной АС (обновление ПО, замена оборудования, изменение топологии) выполняется так, чтобы не снизить уровень защиты: анализ влияния изменений, обновление модели угроз, корректировка настроек СЗИ, тестирование в изолированной среде, поэтапное внедрение. Порядок работ фиксируется в плане: резервное копирование, внедрение, проверка функций защиты, обновление документации, при существенных изменениях — повторная оценка соответствия/аттестация. Откат должен быть возможен на каждом этапе. Проверяемая опора ответа — ГОСТ Р 51583-2014 (работы по созданию АС в защищенном исполнении) и Требования приказа ФСТЭК № 117 к созданию и развитию (модернизации) систем.", "topic": "Тема 2.1.3. Содержание и порядок выполнения работ по защите информации при модернизации автоматизированной системы в защищенном исполнении", "sources": [["ГОСТ Р 51583-2014 «Защита информации. Порядок создания автоматизированных систем в защищенном исполнении» (действующий)", "https://base.garant.ru/70795270/"], ["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"]]}, {"id": 39, "question": "39. Построение модели угроз?", "answer": "Модель угроз — документ, описывающий актуальные для конкретной системы угрозы: источники, нарушителей и их возможности, уязвимости, объекты воздействия, сценарии атак и оценку последствий. Строится обследованием системы, инвентаризацией активов и анализом статистики инцидентов. Этапы: описание системы и данных, определение нарушителей, выявление уязвимостей, формирование перечня угроз, оценка вероятности и ущерба, выбор мер нейтрализации. Модель угроз — обязательная основа выбора мер защиты и регулярно пересматривается. Проверяемая опора ответа — Методика оценки угроз ФСТЭК от 05.02.2021: построение модели угроз, банк данных угроз.", "topic": "Тема 1.3.5. Построение модели угроз", "sources": [["Методика оценки угроз безопасности информации, ФСТЭК России, 05.02.2021 (действующая)", "https://garant.ru/products/ipo/prime/doc/400325044/"]]}, {"id": 40, "question": "40. Правила работы с конфиденциальными ресурсами?", "answer": "Правила работы с конфиденциальными ресурсами: доступ только при служебной необходимости и в пределах полномочий, запрет копирования на личные носители и пересылки по открытым каналам, маркировка документов, хранение в специально отведенных местах, чистый стол и заблокированный экран. Технически поддерживается полномочным управлением доступом (доступ по грифам/категориям с учетом допуска пользователя), регистрацией обращений к ресурсам и контролем печати. Нарушения режима влекут ответственность вплоть до уголовной.", "topic": "Тема 2.5.2. Управление доступом и контроль печати конфиденциальной информации. Правила работы с конфиденциальными ресурсами. Настройка механизма полномочного управления доступом. Настройка регистрации событий. Управление режимом потоков. Управление режимом контроля печати конфиденциальных документов. Управление грифами конфиденциальности.", "sources": [["Федеральный закон от 29.07.2004 № 98-ФЗ «О коммерческой тайне» (действующий)", "https://rulaws.ru/laws/Federalnyy-zakon-ot-29.07.2004-N-98-FZ/"]]}, {"id": 41, "question": "41. Анализ угроз безопасности информации?", "answer": "Анализ угроз безопасности информации — систематическое выявление и оценка угроз для конкретной системы: сбор данных об активах и уязвимостях, определение нарушителей, построение сценариев атак, оценка вероятности и ущерба, ранжирование угроз. Результат — перечень актуальных угроз с приоритетами, на основе которого выбирают меры защиты и обосновывают затраты. Анализ повторяется при изменении системы, появлении новых уязвимостей и по итогам инцидентов. Проверяемая опора ответа — Методика оценки угроз ФСТЭК от 05.02.2021: выявление, классификация и оценка угроз.", "topic": "Тема 1.3.4. Анализ угроз безопасности информации", "sources": [["Методика оценки угроз безопасности информации, ФСТЭК России, 05.02.2021 (действующая)", "https://garant.ru/products/ipo/prime/doc/400325044/"]]}, {"id": 42, "question": "42. Установка и настройка СЗИ от НСД?", "answer": "Установка и настройка СЗИ от НСД выполняются по документации производителя и проекту: установка сертифицированных средств (например, комплексов защиты с идентификацией, контролем доступа, регистрацией), настройка политик, интеграция с ОС и приложениями, проверка совместимости. После установки проводятся тестирование функций, обучение пользователей и администраторов, оформление записей в эксплуатационной документации. Обновления СЗИ ставятся своевременно, с предварительной проверкой. Проверяемая опора ответа — РД Гостехкомиссии по защите АС от НСД (1992, исторический): подсистемы защиты (идентификация, управление доступом, регистрация).", "topic": "Тема 2.5.3. Установка и настройка СЗИ от НСД", "sources": [["РД. Автоматизированные системы. Защита от НСД. Классификация АС и требования по защите информации, Гостехкомиссия России, 1992 (исторический документ)", "https://base.garant.ru/197886/"]]}, {"id": 43, "question": "43. Категорирование информационных ресурсов?", "answer": "Категорирование информационных ресурсов — отнесение данных к категориям по значимости и требованиям к защите. Общие категории доступа устанавливает закон № 149-ФЗ: общедоступная информация и информация ограниченного доступа. Режим коммерческой тайны — лишь один из видов конфиденциальной информации, его устанавливает и регулирует закон № 98-ФЗ (перечень сведений, ограничение доступа, гриф, учет лиц). Персональные данные и служебная информация регулируются своими нормами. Критерии: ущерб от разглашения/искажения/утраты, требования законов, ценность для деятельности. Категория определяет режим доступа, маркировку, меры защиты и ответственность. Перечень категорий закрепляется локальным актом организации.", "topic": "Тема 1.3.2. Категорирование информационных ресурсов", "sources": [["Федеральный закон от 29.07.2004 № 98-ФЗ «О коммерческой тайне» (действующий)", "https://rulaws.ru/laws/Federalnyy-zakon-ot-29.07.2004-N-98-FZ/"], ["Федеральный закон от 27.07.2006 № 149-ФЗ «Об информации, информационных технологиях и о защите информации» (действующий)", "https://rulaws.ru/laws/Federalnyy-zakon-ot-27.07.2006-N-149-FZ/"]]}, {"id": 44, "question": "44. Устранение отказов и восстановление работоспособности компонентов систем защиты информации автоматизированных систем?", "answer": "При отказе компонентов СЗИ порядок действий: фиксация признаков отказа, анализ журналов и диагностика, локализация (изоляция неисправного узла без остановки всей защиты, если возможно), восстановление из резервной копии конфигурации или переустановка, проверка работоспособности. После восстановления проводится разбор причин, обновление документации и, при необходимости, корректировка мер (замена версий, дублирование критичных компонентов). Все простои и действия фиксируются.", "topic": "Тема 2.6.3. Устранение отказов и восстановление работоспособности компонентов систем защиты информации автоматизированных систем", "sources": [["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"]]}, {"id": 45, "question": "45. Оформление основных эксплуатационных документов на автоматизированную систему?", "answer": "Оформление эксплуатационных документов на АС включает: титульные данные и версии, описание состава и конфигураций, инструкции по установке, настройке и повседневным операциям, регламенты обслуживания и восстановления, формы журналов, порядок внесения изменений. Документы должны быть согласованы, утверждены, актуальны и доступны персоналу по ролям. Изменения в системе вносятся только с одновременным обновлением документации — иначе эксплуатация становится неконтролируемой. Проверяемая опора ответа — ГОСТ Р 59795-2021: требования к оформлению и ведению эксплуатационных документов АС.", "topic": "Тема 2.7.2. Оформление основных эксплуатационных документов на автоматизированную систему.", "sources": [["ГОСТ Р 59795-2021 «Защита информации. Создание автоматизированных систем в защищенном исполнении. Эксплуатационная документация» (действующий)", "https://base.garant.ru/403358611/"]]}, {"id": 46, "question": "46. Основные механизмы защиты?", "answer": "Основные механизмы защиты СЗИ от НСД: идентификация и аутентификация, управление доступом (дискреционное, мандатное/полномочное, ролевое), регистрация и учет событий, контроль целостности, управление устройствами и носителями, замкнутая программная среда, шифрование. Архитектура СЗИ включает ядро (монитор обращений), средства управления политиками и консоль администратора. Общие принципы управления: централизованность, минимальные привилегии, непрерывность контроля и регулярная проверка эффективности. Проверяемая опора ответа — РД Гостехкомиссии по защите АС от НСД (1992, исторический): подсистемы и механизмы защиты.", "topic": "Тема 2.5.1. Назначение и основные возможности системы защиты от несанкционированного доступа. Архитектура и средства управления. Общие принципы управления. Основные механизмы защиты. Управление устройствами. Контроль аппаратной конфигурации компьютера. Избирательное разграничение доступа к устройствам.", "sources": [["РД. Автоматизированные системы. Защита от НСД. Классификация АС и требования по защите информации, Гостехкомиссия России, 1992 (исторический документ)", "https://base.garant.ru/197886/"]]}, {"id": 47, "question": "47. Использование принтеров для печати конфиденциальных документов?", "answer": "Печать конфиденциальных документов допускается только на разрешенных принтерах: авторизация задания, исключение печати на общих/случайных устройствах, получение распечаток лично, учет выданных копий, уничтожение брака и лишних экземпляров установленным порядком. Принтеры размещаются в контролируемых помещениях, драйверы и очереди печати защищаются от перехвата, задания журналируются. Цель — чтобы каждая конфиденциальная копия была учтена от создания до уничтожения. Требование маркирования документов при выводе на печать закреплено в мере ОД.8 методдокумента ФСТЭК (2026).", "topic": "Тема 2.5.5. Использование принтеров для печати конфиденциальных документов. Контроль печати", "sources": [["Федеральный закон от 29.07.2004 № 98-ФЗ «О коммерческой тайне» (действующий)", "https://rulaws.ru/laws/Federalnyy-zakon-ot-29.07.2004-N-98-FZ/"], ["Методдокумент ФСТЭК от 12.04.2026 «Состав и содержание мероприятий и мер по обеспечению защиты информации»", "https://base.garant.ru/414070697/"]]}, {"id": 48, "question": "48. Задачи и этапы проектирования автоматизированных систем в защищенном исполнении?", "answer": "Проектирование АС в защищенном исполнении решает задачи: анализ требований и угроз, выбор архитектуры и мер защиты, разработка проекта подсистемы ИБ, планирование внедрения и испытаний. Этапы: обследование, ТЗ, эскизный и технический проекты, рабочая документация, внедрение, испытания, приемка. Методологии — от каскадной (по стадиям ГОСТ 34.601-90, исторически) до итеративных; организация работ распределяет функции заказчика (требования, приемка) и разработчика (проектирование, реализация). Защита проектируется параллельно с основной системой, а не «после». Проверяемая опора ответа — ГОСТ Р 51583-2014 (действующий порядок создания АС в защищенном исполнении); каскадная схема ГОСТ 34.601-90 — исторический ориентир.", "topic": "Тема 1.2.2. Задачи и этапы проектирования автоматизированных систем в защищенном исполнении. Методологии проектирования. Организация работ, функции заказчиков и разработчиков.", "sources": [["ГОСТ Р 51583-2014 «Защита информации. Порядок создания автоматизированных систем в защищенном исполнении» (действующий)", "https://base.garant.ru/70795270/"], ["ГОСТ 34.601-90 «Автоматизированные системы. Стадии создания» (утратил силу в РФ, исторический ориентир)", "https://base.garant.ru/187735/"]]}, {"id": 49, "question": "49. Методы, способы и средства обеспечения отказоустойчивости автоматизированных систем?", "answer": "Отказоустойчивость АС обеспечивается: резервированием (дублирование серверов, дисковые массивы RAID, резервные каналы связи), кластеризацией и балансировкой нагрузки, бесперебойным питанием, регулярным резервным копированием, мониторингом состояния и автоматическим переключением на резерв. Способы: горячий/холодный резерв, географическое разнесение, репликация данных. Средства: отказоустойчивое оборудование, ПО кластеризации, системы мониторинга. Цель — непрерывность критичных функций при отказах отдельных компонентов. Требования создания резервных копий и регулярных тренировок восстановления закреплены в разделе 3.14 методдокумента ФСТЭК (2026).", "topic": "Тема 2.2.1. Задачи и функции администрирования автоматизированных систем. Автоматизация управления сетью. Организация администрирования автоматизированных систем. Административный персонал и работа с пользователями. Управление, тестирование и эксплуатация автоматизированных систем. Методы, способы и средства обеспечения отказоустойчивости автоматизированных систем", "sources": [["Приказ ФСТЭК России от 11.04.2025 № 117 (действующий, вступил в силу 01.03.2026)", "https://lawnotes.ru/npa/prikaz-fstek-rossii-ot-11.04.2025-n-117"], ["Методдокумент ФСТЭК от 12.04.2026 «Состав и содержание мероприятий и мер по обеспечению защиты информации»", "https://base.garant.ru/414070697/"]]}, {"id": 50, "question": "50. Требования к АИС: гибкость, надежность, эффективность, безопасность?", "answer": "Требования к АИС: гибкость — способность адаптироваться к изменениям (масштабирование, настройка); надежность — стабильная работа и восстановление после сбоев; эффективность — достижение целей при разумных затратах ресурсов; безопасность — защита конфиденциальности, целостности и доступности. Ресурсы АИС (ввод, обработка, вывод, обратная связь) должны поддерживаться на всем жизненном цикле: от проектирования с запасом мощности до мониторинга и модернизации. Баланс четырех требований определяет качество системы. Требования к АИС фиксируются в техническом задании; состав ТЗ задает ГОСТ 34.602-2020.", "topic": "Тема 1.1.2. Примеры областей применения АИС. Ресурсы в АИС: ввод, обработка, вывод, обратная связь. Требования к АИС: гибкость, надежность, эффективность, безопасность.", "sources": [["ГОСТ 34.602-2020 (состав ТЗ на создание АС, действует с 01.01.2022 взамен ГОСТ 34.602-89)", "https://base.garant.ru/403255670/"]]}];
const questions=document.getElementById('questions'),answer=document.getElementById('answer'),count=document.getElementById('count');
let current=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(item,btn){current=item;document.querySelectorAll('.q').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');let src='';if(item.sources.length){src='<div class="sources-title">Источники</div><div class="sources">'+item.sources.map(s=>'<a href="'+esc(s[1])+'" target="_blank" rel="noopener noreferrer">'+esc(s[0])+'</a>').join('')+'</div>'}answer.innerHTML='<div class="answer-top"><div class="answer-id">Вопрос №'+String(item.id).padStart(2,'0')+'</div><h2>'+esc(item.question)+'</h2></div><div class="answer-body">'+(item.topic?'<div class="topic">'+esc(item.topic)+'</div>':'')+'<p>'+esc(item.answer)+'</p>'+src+'</div>';if(window.innerWidth<851)answer.scrollIntoView({behavior:'smooth',block:'start'})}
count.textContent=data.length+' вопросов';
data.forEach(item=>{const b=document.createElement('button');b.className='q';b.innerHTML='<span class="num">'+String(item.id).padStart(2,'0')+'</span><span class="qt">'+esc(item.question)+'</span>';b.addEventListener('click',()=>show(item,b));questions.appendChild(b)});
