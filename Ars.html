const result = document.getElementById("result");

function showAnswer(item) {
  result.innerHTML = `
    <h2 class="result-question">${item.id}. ${item.question}</h2>
    <div class="answer">${item.answer}</div>
    <div class="topic">Тема: ${item.topic}</div>
    <div class="source">
      Источник:
      <a href="${item.url}" target="_blank" rel="noopener">${item.sourceName}</a>
    </div>
  `;
}

questions.forEach((item) => {
  const wrapper = document.createElement("div");
  wrapper.className = "question";

  const button = document.createElement("button");
  button.textContent = item.id + ". " + item.question;
  button.addEventListener("click", () => showAnswer(item));

  wrapper.appendChild(button);
  questionsBox.appendChild(wrapper);
});
