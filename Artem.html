<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МДК — вопросы</title>
<style>
*{box-sizing:border-box}
:root{--bg:#eeeeee;--paper:#fff;--soft:#f7f7f7;--line:#d0d0d0;--line2:#e4e4e4;--text:#252525;--muted:#707070;--dark:#292929;--link:#3f5d9b}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.header{height:66px;background:var(--dark);color:#fff;border-bottom:3px solid #d7d7d7}
.header-inner{width:min(1060px,92%);height:100%;margin:auto;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:11px}.brand-title{font-size:22px;font-weight:700}.brand-subtitle{font-size:12px;color:#bdbdbd}.header-note{font-size:12px;color:#bdbdbd}.header-note b{color:#fff}
.page{width:min(1060px,92%);margin:25px auto 38px}
.intro{display:flex;align-items:end;justify-content:space-between;margin-bottom:15px;gap:25px}.intro h1{font-size:28px;margin:5px 0 0}.intro>p{font-size:13px;color:var(--muted);margin:0 0 3px;text-align:right}.small-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#888;font-weight:700}

/* Поиск */
.search-card{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:15px 17px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.search-label{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}.search-label span{font-size:13px;font-weight:700}.search-label small{font-size:10px;color:#999}
.search-row{display:flex;gap:7px}.search-row input{height:42px;flex:1;min-width:0;border:1px solid #999;border-radius:3px;padding:0 12px;font-size:14px;outline:0;background:#fff}.search-row input:focus{border-color:#555}.search-row button{height:42px;padding:0 19px;border:1px solid #333;border-radius:3px;background:#333;color:#fff;font-weight:700;cursor:pointer}.search-row button:hover{background:#1d1d1d}
.search-actions{display:flex;align-items:center;justify-content:flex-end;gap:5px;flex-wrap:wrap;max-width:390px}.search-actions>span{font-size:10px;color:#999;margin-right:2px}.search-actions button{border:1px solid #ccc;background:#f4f4f4;color:#555;border-radius:3px;padding:6px 8px;font-size:10px;cursor:pointer}.search-actions button:hover{background:#e8e8e8}

/* Верхний блок после поиска */
.top-content{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:14px;margin-top:14px}
.result,.help-panel,.questions-panel{background:var(--paper);border:1px solid var(--line);border-radius:5px}
.result{padding:18px 19px;min-height:156px}.result.empty{background:#fafafa}.result-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#888;font-weight:700}.result h2{font-size:19px;line-height:1.4;margin:8px 0}.result p{font-size:13px;line-height:1.55;color:#555;margin:0}.result-top{display:flex;align-items:center;justify-content:space-between}.number{font-size:11px;background:#ededed;padding:5px 8px;border-radius:3px;color:#555}.answer{margin-top:4px!important}.result-bottom{border-top:1px solid var(--line2);margin-top:14px;padding-top:10px;display:flex;gap:10px;align-items:center;font-size:11px}.topic{background:#f1f1f1;padding:4px 7px;border-radius:3px;color:#666}.result-bottom a{color:var(--link);text-decoration:none}
.help-panel{padding:17px 18px}.help-panel h2{font-size:17px;margin:5px 0 15px}.steps{display:flex;flex-direction:column;gap:11px}.steps div{display:flex;align-items:flex-start;gap:9px;font-size:12px;line-height:1.45;color:#666}.steps b{width:20px;height:20px;flex:0 0 20px;border:1px solid #ccc;background:#f5f5f5;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#555}

/* Список вопросов */
.questions-panel{margin-top:14px;padding:17px}.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:9px}.section-head h2{font-size:18px;margin:5px 0 0}.count{font-size:11px;color:#777;border:1px solid var(--line);padding:5px 8px;border-radius:3px}
.questions-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
.question-row{width:100%;min-height:52px;display:grid;grid-template-columns:27px 1fr 15px;align-items:start;gap:5px;border:0;border-top:1px solid var(--line2);background:#fff;padding:10px 3px;text-align:left;cursor:pointer;color:#333}.question-row:hover{background:#f8f8f8}.q-number{font-size:10px;color:#888;padding-top:2px}.q-text{font-size:12px;line-height:1.4}.arrow{font-size:17px;color:#aaa;text-align:right}
footer{margin-top:17px;color:#888;font-size:11px}
@media(max-width:820px){.search-card{grid-template-columns:1fr}.search-actions{justify-content:flex-start;max-width:none}.top-content{grid-template-columns:1fr}.intro{display:block}.intro>p{text-align:left;margin-top:7px}.questions-grid{grid-template-columns:1fr}}
@media(max-width:520px){.header-note{display:none}.page{width:94%;margin-top:20px}.intro h1{font-size:24px}.search-row{flex-direction:column}.search-row button{width:100%}.questions-panel,.result,.help-panel{padding:15px}.search-card{padding:14px}.search-actions button{font-size:10px}}

.below.single-column {
  display: block;
}
.below.single-column .questions-panel {
  width: 100%;
}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-title">МДК</div>
      <div class="brand-subtitle">Вопросы для подготовки</div>
    </div>
    <div class="header-note">База: <b>50</b> вопросов</div>
  </div>
</header>

<main class="page">
  <section class="intro">
    <div>
      <div class="small-title">Учебная база</div>
      <h1>Вопросы к экзамену</h1>
    </div>
  </section>

  <section class="search-card">
    <div class="search-main">
      <div class="search-label">
        <span>Поиск</span>
        <small>номер или ключевое слово</small>
      </div>
      <div class="search-row">
        <input id="questionInput" type="text" placeholder="Например: 11 или «аутентификация»">
        <button id="searchButton">Найти</button>
      </div>
    </div>
    <div class="search-actions">
      <span>Быстро:</span>
      <button data-query="уязвимость">уязвимость</button>
      <button data-query="аутентификация">аутентификация</button>
      <button data-query="целостность">целостность</button>
      <button id="randomButton">случайный вопрос</button>
    </div>
  </section>

  <section class="top-content">
    <section id="result" class="result empty">
      <div class="result-label">Результат поиска</div>
      <h2>Вопрос пока не выбран</h2>
      <p>Введи номер или слово в строке поиска.</p>
    </section>
  </section>

  <section class="questions-panel">
    <div class="section-head">
      <div>
        <div class="small-title">Навигация</div>
        <h2>Все вопросы</h2>
      </div>
      <span id="count" class="count">50</span>
    </div>
    <div id="questions" class="questions-grid"></div>
  </section>

  <footer>МДК · учебная база вопросов</footer>
</main>

    "url": "https://www.iso.org/standard/35733.html",
    "normalized": "требования к аис гибкость надежность эффективность безопасность"
  }
];

const input = document.getElementById("questionInput");
const result = document.getElementById("result");
const questionsBox = document.getElementById("questions");
const count = document.getElementById("count");

count.textContent = questions.length;

function normalize(value) {
  return String(value || "")
    .toLowerCase()
    .replace(/ё/g, "е")
    .replace(/[^а-яa-z0-9\s]/gi, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function showResult(item) {
  if (!item) {
    result.className = "result empty";
    result.innerHTML = `
      <div class="result-label">Результат</div>
      <h2>Ничего не найдено</h2>
      <p>Попробуй другой номер или ключевое слово.</p>`;
    return;
  }

  result.className = "result";
  result.innerHTML = `
    <div class="result-top">
      <div class="result-label">Найденный вопрос</div>
      <span class="number">№ ${item.id}</span>
    </div>
    <h2>${item.question}</h2>
    <p class="answer">${item.answer}</p>
    <div class="result-bottom">
      <span class="topic">${item.topic || "МДК"}</span>
      <a href="${item.url}" target="_blank" rel="noopener">${item.sourceName || "Источник"} ↗</a>
    </div>`;
}

function search() {
  const value = normalize(input.value);
  if (!value) {
    showResult(null);
    return;
  }

  if (/^\d+$/.test(value)) {
    showResult(questions.find(q => String(q.id) === value));
    return;
  }

  const words = value.split(" ").filter(w => w.length > 2);
  let best = null;
  let score = 0;

  questions.forEach(q => {
    const text = normalize(`${q.question} ${q.answer} ${q.topic}`);
    let s = text.includes(value) ? 10 : 0;
    words.forEach(word => { if (text.includes(word)) s += 1; });
    if (s > score) {
      score = s;
      best = q;
    }
  });

  showResult(score ? best : null);
}

function renderQuestions() {
  questionsBox.innerHTML = "";
  questions.forEach(q => {
    const row = document.createElement("button");
    row.className = "question-row";
    row.innerHTML = `
      <span class="q-number">${q.id}</span>
      <span class="q-text">${q.question}</span>
      <span class="arrow">›</span>`;
    row.onclick = () => {
      input.value = q.question;
      showResult(q);
      window.scrollTo({top: 0, behavior: "smooth"});
    };
    questionsBox.appendChild(row);
  });
}

document.getElementById("searchButton").addEventListener("click", search);
input.addEventListener("keydown", e => {
  if (e.key === "Enter") search();
});

document.querySelectorAll(".search-actions button[data-query]").forEach(btn => {
  btn.addEventListener("click", () => {
    input.value = btn.getAttribute("data-query");
    search();
  });
});

document.getElementById("randomButton").addEventListener("click", () => {
  const randomIndex = Math.floor(Math.random() * questions.length);
  const randomQ = questions[randomIndex];
  input.value = randomQ.question;
  showResult(randomQ);
});

renderQuestions();
</script>
</body>
</html>
