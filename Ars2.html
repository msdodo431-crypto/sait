const questions = [
{num:1,title:"1. Назначение и основные возможности СЗИ от несанкционированного доступа.",answer:"<strong>Ответ:</strong><p>СЗИ от НСД предназначено для защиты информации, обрабатываемой на рабочих станциях и серверах, от несанкционированного доступа, утечки, искажения и уничтожения. Оно закрывает те риски, которые штатными средствами ОС не закрываются: вход пользователя, разграничение прав на ресурсы, контроль запускаемого ПО, контроль устройств и печати.</p><p>Основные возможности (на примере Secret Net Studio): идентификация и аутентификация, дискреционное и полномочное управление доступом, контроль целостности, замкнутая программная среда, контроль подключения и изменения устройств, контроль печати, гарантированное затирание данных, регистрация событий и аудит, централизованное управление и мониторинг. Состав обязательных механизмов для АС определяется классом защищённости по руководящему документу Гостехкомиссии.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:2,title:"2. Основные эксплуатационные документы защищённой автоматизированной системы и их назначение.",answer:"<strong>Ответ:</strong><p>К эксплуатационным относятся документы, по которым систему используют и обслуживают: руководство пользователя, руководство администратора (в т.ч. администратора безопасности), инструкции по эксплуатации технических средств и ПО, технический паспорт (формуляр), программа и методика испытаний, акт ввода в эксплуатацию. Виды и комплектность документов задаёт ГОСТ 34.201-2020, требования к содержанию — ГОСТ Р 59795-2021.</p><p>Назначение: пользователю — правила работы; администратору — порядок настройки, обслуживания и восстановления; паспорт фиксирует состав и конфигурацию системы; акт и протоколы испытаний подтверждают готовность к эксплуатации. Дополнительно в организации действуют организационно-распорядительные документы (приказы, инструкции, журналы учёта).</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ 34.201-2020 «Виды, комплектность и обозначение документов при создании автоматизированных систем»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html</a></div><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59795-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59795-2021 «Комплекс стандартов на автоматизированные системы. Автоматизированные системы. Требования к содержанию документов»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59795-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59795-2021_natsionalnyy_standart_rossiyskoy.html</a></div></div>"},
{num:3,title:"3. Архитектура СЗИ от НСД и назначение её основных компонентов.",answer:"<strong>Ответ:</strong><p>Система Secret Net Studio строится по клиент-серверному принципу. Клиент устанавливается на защищаемый компьютер: драйверы и службы реализуют механизмы защиты, локальный центр управления позволяет настраивать их на месте. Сервер безопасности хранит политики и журналы в базе данных и обменивается данными с клиентами.</p><p>Программа управления (центр управления) служит администратору для настройки политик, мониторинга и аудита. Для защиты до загрузки ОС применяется аппаратно-программный модуль доверенной загрузки (ПАК «Соболь»). Компоненты могут объединяться в иерархию серверов безопасности для распределённых инфраструктур.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Централизованное управление, мониторинг и аудит»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:4,title:"4. Этапы установки и ввода в эксплуатацию средств защиты в компьютерной сети.",answer:"<strong>Ответ:</strong><p>Типовая последовательность: 1) подготовка (проверка комплектности, совместимости, сертификатов, резервирование); 2) установка серверной части и базы данных; 3) установка программы управления; 4) установка клиентов на защищаемые компьютеры и их включение в структуру управления; 5) настройка политик и учётных записей; 6) проверка работоспособности механизмов; 7) опытная эксплуатация; 8) оформление акта ввода в эксплуатацию.</p><p>Все действия выполняются по эксплуатационной документации производителя и проектным решениям и документируются. ГОСТ Р 51583-2014 включает в порядок создания защищённой АС этап ввода в действие, а ГОСТ Р 59792-2021 определяет виды испытаний, на которых подтверждается работоспособность.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 51583-2014 «Защита информации. Порядок создания автоматизированных систем в защищенном исполнении. Общие положения»</a> — <a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">https://base.garant.ru/70795270/</a></div><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59792-2021 «Комплекс стандартов на автоматизированные системы. Виды испытаний автоматизированных систем»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html</a></div></div>"},
{num:5,title:"5. Идентификация и аутентификация пользователей: назначение, различия и способы реализации.",answer:"<strong>Ответ:</strong><p>Идентификация — предъявление системе идентификатора (имени, персонального идентификатора), аутентификация — проверка подлинности этого субъекта. Назначение — убедиться, что в систему входит именно тот пользователь, от имени которого будут разграничиваться права и фиксироваться действия.</p><p>Способы: пароль (с политикой длины, сложности, срока действия и блокировкой при неудачных попытках), персональные идентификаторы (токены, смарт-карты), их сочетание (двухфакторная аутентификация). Аутентификация до загрузки ОС реализуется модулем доверенной загрузки. Руководящий документ Гостехкомиссии требует идентификацию и проверку подлинности субъектов при входе в систему.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Руководящий документ Гостехкомиссии России (1997) «Автоматизированные системы. Защита от несанкционированного доступа к информации. Классификация автоматизированных систем и требования по защите информации»</a> — <a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://ancud.ru/old/law/rdasnsd.pdf</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:6,title:"6. Контроль целостности информации: контролируемые объекты, эталон и действия при нарушении.",answer:"<strong>Ответ:</strong><p>Контролируемые объекты: файлы и каталоги (содержимое, атрибуты, права), ключи и параметры реестра, а также исполняемые модули и компоненты самой СЗИ. Эталон — значения контрольных сумм (хешей) и атрибутов объектов, зафиксированные в шаблоне на момент, когда система признана доверенной.</p><p>Проверка выполняется при загрузке, при входе пользователя или по расписанию: текущие значения сравниваются с эталоном. При нарушении регистрируется событие (тревога), может блокироваться вход или компьютер, а администратор анализирует причину и либо восстанавливает объект, либо при санкционированном изменении пересчитывает эталон.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Руководящий документ Гостехкомиссии России (1997) «Автоматизированные системы. Защита от несанкционированного доступа к информации. Классификация автоматизированных систем и требования по защите информации»</a> — <a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://ancud.ru/old/law/rdasnsd.pdf</a></div></div>"},
{num:7,title:"7. Избирательное разграничение доступа к устройствам: принципы и настройка.",answer:"<strong>Ответ:</strong><p>Избирательное (дискреционное) управление доступом означает, что администратор определяет, какие пользователи и с какими правами (чтение, запись, запрет) могут обращаться к конкретным устройствам: съёмным носителям, принтерам, портам, сетевым адаптерам и т.д. Устройства объединяются в группы и модели, чтобы задавать права не по одному.</p><p>Настройка выполняется в политиках механизма контроля устройств: формируется список контролируемых устройств, для групп устройств задаются права пользователей и режим (разрешено, запрещено, только чтение), параметры применяются централизованно с наследованием, а события доступа попадают в журнал. Принцип минимальных привилегий — разрешается только необходимое.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Руководящий документ Гостехкомиссии России (1997) «Автоматизированные системы. Защита от несанкционированного доступа к информации. Классификация автоматизированных систем и требования по защите информации»</a> — <a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://ancud.ru/old/law/rdasnsd.pdf</a></div></div>"},
{num:8,title:"8. Технический паспорт защищаемой автоматизированной системы: назначение и состав сведений.",answer:"<strong>Ответ:</strong><p>Технический паспорт — документ, который фиксирует фактический состав и конфигурацию автоматизированной системы и средств её защиты на определённый момент. Он нужен для учёта, контроля неизменности конфигурации, проведения аттестации и при расследовании инцидентов.</p><p>Типовой состав сведений: назначение и категория системы, перечень и размещение технических средств, состав системного и прикладного ПО, схема сети, применяемые СЗИ (версии, сертификаты), основные настройки, ответственные лица, сведения об изменениях. Точная структура определяется ТЗ и документами организации в соответствии с ГОСТ 34.201-2020.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ 34.201-2020 «Виды, комплектность и обозначение документов при создании автоматизированных систем»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html</a></div><div class=\"q-source-item\"><a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 51583-2014 «Защита информации. Порядок создания автоматизированных систем в защищенном исполнении. Общие положения»</a> — <a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">https://base.garant.ru/70795270/</a></div></div>"},
{num:9,title:"9. Полномочное управление доступом: метки конфиденциальности и полномочия пользователей.",answer:"<strong>Ответ:</strong><p>При полномочном (мандатном) управлении доступом ресурсам (файлам, каталогам, устройствам, принтерам) присваиваются категории (метки) конфиденциальности, а пользователям — уровни допуска. Решение о доступе принимается автоматически по правилу: доступ разрешён, если уровень допуска пользователя не ниже категории ресурса.</p><p>Дополнительно действует запрет передачи информации с более высокого уровня на более низкий (контроль потоков). Присваивать метки и допуски может только администратор безопасности, обычный пользователь изменить их не может. Механизм дополняет, а не заменяет дискреционное управление доступом.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Руководящий документ Гостехкомиссии России (1997) «Автоматизированные системы. Защита от несанкционированного доступа к информации. Классификация автоматизированных систем и требования по защите информации»</a> — <a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://ancud.ru/old/law/rdasnsd.pdf</a></div></div>"},
{num:10,title:"10. Оперативный мониторинг и аудит безопасности: цели и различия.",answer:"<strong>Ответ:</strong><p>Оперативный мониторинг — наблюдение в режиме, близком к реальному времени, за состоянием защищаемых компьютеров, тревогами и работой механизмов защиты; цель — быстро обнаружить нарушение и среагировать (в т.ч. оперативно заблокировать компьютер). Аудит — последующий анализ накопленных журналов и отчётов; цель — выявить нарушения, оценить соблюдение политик и расследовать инциденты.</p><p>Различие в том, что мониторинг направлен на текущие события и немедленную реакцию, а аудит — на ретроспективный анализ. ГОСТ Р 59547-2021 определяет мониторинг ИБ как процесс постоянного наблюдения и анализа результатов регистрации событий безопасности.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Централизованное управление, мониторинг и аудит»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/10/gost_r_59547-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59547-2021 «Защита информации. Мониторинг информационной безопасности. Общие положения»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/10/gost_r_59547-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/10/gost_r_59547-2021_natsionalnyy_standart_rossiyskoy.html</a></div></div>"},
{num:11,title:"11. Управление грифами конфиденциальности и правила работы с конфиденциальными ресурсами.",answer:"<strong>Ответ:</strong><p>Грифы (категории) конфиденциальности определяются администратором безопасности в соответствии с принятой в организации классификацией информации. Затем грифы присваиваются ресурсам — часто на уровне каталога с наследованием на вложенные файлы — а пользователям назначается допуск.</p><p>Правила: работа с конфиденциальным ресурсом допускается только при соответствующем допуске; перенос информации на ресурсы с более низким грифом блокируется; вывод на печать и на съёмные носители возможен только на разрешённые и учтённые устройства; все обращения регистрируются в журнале. Изменение грифов — только администратором.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Руководящий документ Гостехкомиссии России (1997) «Автоматизированные системы. Защита от несанкционированного доступа к информации. Классификация автоматизированных систем и требования по защите информации»</a> — <a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://ancud.ru/old/law/rdasnsd.pdf</a></div></div>"},
{num:12,title:"12. Диагностика компонентов СЗИ: последовательность и источники диагностических сведений.",answer:"<strong>Ответ:</strong><p>Последовательность: 1) определить симптом и затронутый компонент (клиент, сервер, база данных, связь); 2) проверить состояние в программе управления и в локальном центре управления (статус защитных подсистем, связь с сервером, применение политик); 3) проверить работу служб и драйверов на компьютере; 4) изучить журналы; 5) проверить сеть и совместимость ПО; 6) устранить причину и повторно проверить.</p><p>Источники сведений: журнал Secret Net Studio и журнал тревог, системные журналы ОС, состояние объектов в программе управления, сведения о версиях и лицензиях, документация производителя. Результаты диагностики фиксируются.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Централизованное управление, мониторинг и аудит»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:13,title:"13. Контроль печати конфиденциальных документов: назначение и основные механизмы.",answer:"<strong>Ответ:</strong><p>Назначение — не допустить вывод конфиденциальной информации на неразрешённые принтеры и обеспечить учёт напечатанных документов. Принтеры рассматриваются как защищаемые ресурсы с собственными правами и категориями конфиденциальности.</p><p>Основные механизмы: дискреционное и полномочное управление доступом к принтерам, маркировка печатаемых документов (гриф, реквизиты пользователя), теневое копирование распечатанных документов и регистрация каждого задания печати в журнале. Эти механизмы входят в состав локальной защиты Secret Net Studio.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Руководящий документ Гостехкомиссии России (1997) «Автоматизированные системы. Защита от несанкционированного доступа к информации. Классификация автоматизированных систем и требования по защите информации»</a> — <a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://ancud.ru/old/law/rdasnsd.pdf</a></div></div>"},
{num:14,title:"14. Правила разработки, актуализации и хранения эксплуатационной документации.",answer:"<strong>Ответ:</strong><p>Состав документов определяется по ГОСТ 34.201-2020, содержание каждого — по ГОСТ Р 59795-2021 и ТЗ (ГОСТ 34.602-2020). Документы разрабатываются на соответствующих стадиях создания системы, согласовываются и утверждаются ответственными лицами, получают обозначение и учётный номер.</p><p>Актуализация выполняется при любом изменении состава оборудования, ПО или настроек СЗИ: вносятся изменения, ведётся история версий, старые редакции изымаются. Хранение — в учтённом виде с ограничением доступа (подлинники и учтённые копии), с резервированием электронных версий.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ 34.201-2020 «Виды, комплектность и обозначение документов при создании автоматизированных систем»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html</a></div><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59795-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59795-2021 «Комплекс стандартов на автоматизированные системы. Автоматизированные системы. Требования к содержанию документов»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59795-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59795-2021_natsionalnyy_standart_rossiyskoy.html</a></div></div>"},
{num:15,title:"15. Регистрация событий безопасности: выбор событий и состав записи журнала.",answer:"<strong>Ответ:</strong><p>Выбор событий определяется задачами защиты и классом системы: вход и выход пользователей (успешные и неуспешные), доступ к защищаемым ресурсам, изменение прав и политик, подключение устройств, печать, нарушения целостности, запуск запрещённых программ, действия администраторов, сбои СЗИ. Избыточная регистрация перегружает журнал, недостаточная не позволяет расследовать инциденты.</p><p>По ГОСТ Р 59548-2022 запись должна содержать информацию, достаточную для выявления нарушений и реагирования: дату и время, тип события, источник, субъект (пользователь, процесс), объект, результат (успех или неудача) и сопутствующие сведения. Журнал должен быть защищён от изменения.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59548-2022_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59548-2022 «Защита информации. Регистрация событий безопасности. Требования к регистрируемой информации»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59548-2022_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59548-2022_natsionalnyy_standart_rossiyskoy.html</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:16,title:"16. Порядок технического обслуживания средств защиты информации.",answer:"<strong>Ответ:</strong><p>Техническое обслуживание — комплекс операций по поддержанию работоспособности и исправности средства. Для СЗИ оно включает плановые (регламентные) работы: проверку состояния и версий компонентов, анализ журналов и тревог, проверку и актуализацию политик, проверку целостности, установку обновлений после тестирования, резервное копирование конфигурации и базы данных.</p><p>Порядок: составить график обслуживания, выполнить работы по эксплуатационной документации, зафиксировать результаты в журнале, при выявлении неисправностей — перейти к корректирующему обслуживанию и восстановлению. Термины и виды технического обслуживания определены в ГОСТ 18322-2016.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://pravo.ppt.ru/standart/134823\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ 18322-2016 «Система технического обслуживания и ремонта техники. Термины и определения»</a> — <a href=\"https://pravo.ppt.ru/standart/134823\" rel=\"noopener noreferrer\" target=\"_blank\">https://pravo.ppt.ru/standart/134823</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:17,title:"17. Контроль аппаратной конфигурации компьютера: назначение и реакция на изменения.",answer:"<strong>Ответ:</strong><p>Назначение — выявлять подключение, отключение и замену устройств (плат, накопителей, периферии), которые могут свидетельствовать о попытке хищения информации или о подмене оборудования. Для этого фиксируется эталон аппаратной конфигурации, с которым сравнивается текущая.</p><p>При изменении конфигурации система регистрирует событие и применяет заданную реакцию: уведомление администратора (тревога), блокировка компьютера до решения администратора, запрет работы устройства. После санкционированного изменения администратор обновляет эталон. Механизм входит в контроль подключения и изменения устройств.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:18,title:"18. Причины отказов средств защиты и способы восстановления их работоспособности.",answer:"<strong>Ответ:</strong><p>Причины: аппаратные неисправности (диск, питание, сеть), сбои и конфликты ПО (в т.ч. после обновлений ОС или установки несовместимых программ), повреждение файлов и драйверов СЗИ, ошибки настройки политик, потеря связи с сервером или базой данных, ошибки персонала, истечение срока лицензий и ключей.</p><p>Способы восстановления: перезапуск служб, устранение конфликта, откат неудачных обновлений или настроек, исправление или переустановка компонента, восстановление конфигурации и базы данных из резервной копии, замена неисправного оборудования. После восстановления обязательна проверка работоспособности механизмов защиты. Понятия обнаружения, локализации и устранения неисправностей определены в ГОСТ 18322-2016.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://pravo.ppt.ru/standart/134823\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ 18322-2016 «Система технического обслуживания и ремонта техники. Термины и определения»</a> — <a href=\"https://pravo.ppt.ru/standart/134823\" rel=\"noopener noreferrer\" target=\"_blank\">https://pravo.ppt.ru/standart/134823</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:19,title:"19. Замкнутая программная среда: назначение и принципы построения.",answer:"<strong>Ответ:</strong><p>Замкнутая программная среда (ЗПС) разрешает на защищаемом компьютере запуск только тех программ и скриптов, которые внесены администратором в список разрешённых; всё остальное блокируется. Это защищает от запуска вредоносного и неучтённого ПО.</p><p>Принципы построения: список (модель данных) формируется на основе эталонной системы или сведений о запущенных программах из журнала; сначала допускается режим с регистрацией нарушений без блокировки, затем включается блокировка; ЗПС настраивается совместно с контролем целостности, чтобы подмена разрешённого файла выявлялась. Изменять список может только администратор.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:20,title:"20. Централизованное управление СЗИ: функции сервера и агентов.",answer:"<strong>Ответ:</strong><p>Сервер безопасности хранит в базе данных структуру защищаемых объектов, политики и журналы, принимает события от клиентов, передаёт им настройки и команды оперативного управления, поддерживает иерархию и резервирование серверов. Администратор работает с сервером через программу управления.</p><p>Агент (клиентская часть) на защищаемом компьютере получает политики и применяет их, обеспечивает работу механизмов защиты, собирает и отправляет события в журнал сервера, выполняет команды (блокировка, перезагрузка, включение и выключение подсистем). При отсутствии связи агент продолжает работать по последним полученным политикам.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Централизованное управление, мониторинг и аудит»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:21,title:"21. Управление информационными потоками между ресурсами разных уровней конфиденциальности.",answer:"<strong>Ответ:</strong><p>Управление потоками — часть полномочного управления доступом. Его задача: информация с более высоким уровнем конфиденциальности не должна попадать в ресурсы с более низким уровнем, где она станет доступна пользователям без соответствующего допуска.</p><p>Реализация: сеанс пользователя работает на определённом уровне конфиденциальности; при работе с ресурсом высокого уровня запись в ресурсы ниже блокируется (копирование, сохранение под другим именем, вывод на устройства и принтеры без нужной категории); попытки нарушения регистрируются в журнале. Режим включается в политиках и применяется ко всем пользователям, не имеющим права его обходить.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Руководящий документ Гостехкомиссии России (1997) «Автоматизированные системы. Защита от несанкционированного доступа к информации. Классификация автоматизированных систем и требования по защите информации»</a> — <a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://ancud.ru/old/law/rdasnsd.pdf</a></div></div>"},
{num:22,title:"22. Акт ввода защищаемой автоматизированной системы в эксплуатацию: назначение и содержание.",answer:"<strong>Ответ:</strong><p>Акт — документ, которым комиссия подтверждает, что создание системы завершено, система прошла испытания и может использоваться по назначению. Он является основанием для начала эксплуатации и фиксирует передачу системы заказчику.</p><p>Содержание: наименование системы и заказчика, основание и состав комиссии, перечень выполненных работ и вводимых компонентов (в т.ч. СЗИ), результаты испытаний и опытной эксплуатации, выявленные замечания и сроки их устранения, заключение о готовности, дата и подписи. К акту прилагаются протоколы испытаний и эксплуатационные документы.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 51583-2014 «Защита информации. Порядок создания автоматизированных систем в защищенном исполнении. Общие положения»</a> — <a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">https://base.garant.ru/70795270/</a></div><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59792-2021 «Комплекс стандартов на автоматизированные системы. Виды испытаний автоматизированных систем»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html</a></div></div>"},
{num:23,title:"23. Основные механизмы защиты входа в систему.",answer:"<strong>Ответ:</strong><p>Защита входа строится на нескольких уровнях: доверенная загрузка до старта ОС (модуль «Соболь»), идентификация и аутентификация пользователя паролем и (или) персональным идентификатором, политики паролей (минимальная длина, сложность, срок действия, история), блокировка учётной записи при серии неудачных попыток.</p><p>Дополнительно применяются ограничения по времени и рабочим станциям, режим входа только по идентификатору, блокировка компьютера при извлечении идентификатора, регистрация всех попыток входа в журнале и контроль RDP-подключений. Всё это настраивается централизованно в политиках.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:24,title:"24. Исследование эффективности проектных решений по защите информации: показатели и методы проверки.",answer:"<strong>Ответ:</strong><p>Показатели эффективности: соответствие требованиям безопасности и классу защищённости АС, полнота перекрытия актуальных угроз, корректность работы каждого механизма защиты, отсутствие возможности обхода, влияние на производительность и удобство работы, остаточные риски.</p><p>Методы проверки: анализ проектной и эксплуатационной документации, испытания по программе и методике (предварительные, приёмочные), функциональное тестирование механизмов, имитация попыток НСД, анализ журналов и конфигураций, контроль (анализ) защищённости. Виды испытаний установлены ГОСТ Р 59792-2021.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59792-2021 «Комплекс стандартов на автоматизированные системы. Виды испытаний автоматизированных систем»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html</a></div><div class=\"q-source-item\"><a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 51583-2014 «Защита информации. Порядок создания автоматизированных систем в защищенном исполнении. Общие положения»</a> — <a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">https://base.garant.ru/70795270/</a></div></div>"},
{num:25,title:"25. Разграничение прав пользователей и администратора при эксплуатации защищённой системы.",answer:"<strong>Ответ:</strong><p>Принцип — разделение полномочий. Пользователь работает только в пределах назначенных прав: он не может отключать СЗИ, менять политики, метки конфиденциальности, список ЗПС и журналы. Администратор безопасности управляет защитой и аудитом, а системный администратор — настройкой ОС и ПО, при этом не получает права на управление защитой и очистку журналов.</p><p>Права назначаются по принципу минимальных привилегий, распределение должностей и ответственности закрепляется организационными документами, действия администраторов регистрируются. Требование к разграничению ролей и регистрации действий заложено в руководящем документе Гостехкомиссии.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Руководящий документ Гостехкомиссии России (1997) «Автоматизированные системы. Защита от несанкционированного доступа к информации. Классификация автоматизированных систем и требования по защите информации»</a> — <a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://ancud.ru/old/law/rdasnsd.pdf</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Централизованное управление, мониторинг и аудит»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:26,title:"26. Порядок восстановления конфигурации СЗИ из резервной копии.",answer:"<strong>Ответ:</strong><p>Порядок: 1) определить причину и необходимость восстановления; 2) выбрать актуальную копию и проверить её целостность и совместимость по версии; 3) при необходимости остановить службы; 4) восстановить базу данных сервера (политики, структуру, журналы) и ключевые данные; 5) запустить компоненты; 6) проверить связь клиентов с сервером и применение политик; 7) проверить работоспособность механизмов защиты; 8) зафиксировать работы в журнале.</p><p>Резервные копии конфигурации и базы данных создаются регулярно по графику, хранятся в защищённом месте отдельно от основного носителя и периодически проверяются на пригодность.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Централизованное управление, мониторинг и аудит»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:27,title:"27. Подготовка к установке СЗИ от НСД: совместимость, ресурсы и резервирование.",answer:"<strong>Ответ:</strong><p>Перед установкой проверяют: комплектность дистрибутива и наличие сертификатов; поддерживаемые версии ОС и отсутствие конфликтов с другим ПО (в том числе с антивирусами и иными средствами защиты) по документу о совместимости; соответствие компьютера минимальным требованиям по процессору, памяти, диску; наличие прав администратора, лицензий и ключей.</p><p>Резервирование: создаются резервные копии данных и состояния системы (образ или точка восстановления), чтобы можно было откатиться при неудачной установке. Порядок работ и результаты проверок документируются.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 51583-2014 «Защита информации. Порядок создания автоматизированных систем в защищенном исполнении. Общие положения»</a> — <a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">https://base.garant.ru/70795270/</a></div></div>"},
{num:28,title:"28. Защита журналов безопасности от изменения и несанкционированного доступа.",answer:"<strong>Ответ:</strong><p>Журналы — основа аудита и расследований, поэтому нарушитель стремится их изменить или стереть. Защита: доступ на чтение и управление только у администратора безопасности (дискреционное управление доступом), запрет очистки журнала обычными пользователями, контроль целостности файлов журналов.</p><p>Дополнительно: передача событий на сервер безопасности (и во внешние системы), регулярная архивация, реакция на переполнение журнала, регистрация самих действий с журналом. Требование защиты регистрационных данных заложено в РД Гостехкомиссии и в ГОСТ Р 59547-2021 (защита данных мониторинга).</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Руководящий документ Гостехкомиссии России (1997) «Автоматизированные системы. Защита от несанкционированного доступа к информации. Классификация автоматизированных систем и требования по защите информации»</a> — <a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://ancud.ru/old/law/rdasnsd.pdf</a></div><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/10/gost_r_59547-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59547-2021 «Защита информации. Мониторинг информационной безопасности. Общие положения»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/10/gost_r_59547-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/10/gost_r_59547-2021_natsionalnyy_standart_rossiyskoy.html</a></div></div>"},
{num:29,title:"29. Настройка контроля целостности файлов и параметров системы.",answer:"<strong>Ответ:</strong><p>Порядок настройки: 1) определить критичные объекты (системные и прикладные файлы, каталоги, ключи реестра, исполняемые модули СЗИ); 2) создать шаблон контроля с указанием объектов и алгоритма контроля; 3) задать реакцию на нарушение (событие, тревога, блокировка); 4) назначить шаблон компьютерам или пользователям и задать расписание проверок; 5) рассчитать эталон на заведомо доверенной системе.</p><p>После санкционированных изменений (обновления, установка ПО) эталон пересчитывается. Результаты проверок просматриваются в журнале. Контроль целостности можно связать с замкнутой программной средой.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:30,title:"30. Правила работы с программным обеспечением в защищённой автоматизированной системе.",answer:"<strong>Ответ:</strong><p>В защищённой АС допускается использовать только разрешённое, лицензионное ПО, входящее в утверждённый перечень и учтённое в паспорте системы. Установку, обновление и удаление ПО выполняет только уполномоченный администратор; пользователям самостоятельная установка запрещена.</p><p>Новое ПО и обновления сначала проверяются (в т.ч. на совместимость с СЗИ и на отсутствие вредоносного кода), затем вносятся в список замкнутой программной среды и в эталоны контроля целостности. Сертифицированные СЗИ нельзя менять без согласования с документацией.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Руководящий документ Гостехкомиссии России (1997) «Автоматизированные системы. Защита от несанкционированного доступа к информации. Классификация автоматизированных систем и требования по защите информации»</a> — <a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://ancud.ru/old/law/rdasnsd.pdf</a></div></div>"},
{num:31,title:"31. Принципы централизованного распространения политик безопасности.",answer:"<strong>Ответ:</strong><p>Политики задаются администратором один раз на сервере в программе управления и применяются ко множеству компьютеров. Объекты управления организуются в иерархическую структуру (подразделения, группы), политики наследуются вниз по структуре, на нижних уровнях могут уточняться, если это разрешено.</p><p>Агенты периодически получают политики с сервера и применяют их на клиентах; результат применения и отклонения контролируются в программе управления. Централизованность обеспечивает единообразие настроек, снижает риск ошибок и ускоряет изменения.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Централизованное управление, мониторинг и аудит»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:32,title:"32. Эксплуатационная документация при изменении состава оборудования или настроек СЗИ.",answer:"<strong>Ответ:</strong><p>Любое изменение (замена компонентов, подключение устройств, смена версии ПО, изменение политик) должно быть санкционировано и отражено в документах. Обновляются технический паспорт, перечни оборудования и ПО, схемы, инструкции и списки разрешённых устройств и программ.</p><p>Порядок: заявка и согласование изменения, выполнение работ, проверка работоспособности СЗИ, внесение записи в журнал изменений, выпуск новой редакции документов с отметкой в листе регистрации изменений и изъятие устаревших копий. После существенных изменений проводятся повторные проверки.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ 34.201-2020 «Виды, комплектность и обозначение документов при создании автоматизированных систем»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html</a></div><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59795-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59795-2021 «Комплекс стандартов на автоматизированные системы. Автоматизированные системы. Требования к содержанию документов»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59795-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59795-2021_natsionalnyy_standart_rossiyskoy.html</a></div></div>"},
{num:33,title:"33. Мониторинг состояния СЗИ и контроль актуальности защитных настроек.",answer:"<strong>Ответ:</strong><p>Мониторинг состояния включает контроль работоспособности защитных подсистем, наличия связи агентов с сервером, версий компонентов и баз, срока действия лицензий и ключей, результатов проверок целостности и тревог. Для этого используется оперативный мониторинг в программе управления.</p><p>Актуальность настроек проверяется периодической сверкой действующих политик с утверждёнными требованиями, анализом отклонений и применения политик на компьютерах, пересмотром прав и списков (устройства, программы). ГОСТ Р 59547-2021 относит к мониторингу ИБ и контроль (анализ) защищённости информации.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Централизованное управление, мониторинг и аудит»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/10/gost_r_59547-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59547-2021 «Защита информации. Мониторинг информационной безопасности. Общие положения»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/10/gost_r_59547-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/10/gost_r_59547-2021_natsionalnyy_standart_rossiyskoy.html</a></div></div>"},
{num:34,title:"34. Порядок устранения неисправностей программно-аппаратных средств защиты в сети.",answer:"<strong>Ответ:</strong><p>Порядок: 1) зафиксировать признак неисправности и время; 2) локализовать место (клиент, сервер, база данных, сетевое оборудование, модуль доверенной загрузки); 3) проверить питание, кабели, сетевые настройки и доступность сервера; 4) проверить службы, журналы и состояние в программе управления; 5) устранить причину (перезапуск, настройка, откат, восстановление из копии, замена); 6) проверить работоспособность защитных механизмов.</p><p>На время ремонта для критичных компьютеров принимаются компенсирующие меры (например, ограничение работы), а результат работ фиксируется в журнале. Этапы обнаружения, локализации и устранения неисправностей описаны в ГОСТ 18322-2016.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://pravo.ppt.ru/standart/134823\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ 18322-2016 «Система технического обслуживания и ремонта техники. Термины и определения»</a> — <a href=\"https://pravo.ppt.ru/standart/134823\" rel=\"noopener noreferrer\" target=\"_blank\">https://pravo.ppt.ru/standart/134823</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:35,title:"35. Диагностика отказов и восстановление работоспособности защищённой автоматизированной системы.",answer:"<strong>Ответ:</strong><p>Диагностика отказа — определение факта отказа, его места и причины. В системе защиты это анализ журналов ОС и СЗИ, состояния служб и драйверов, сетевых связей, аппаратной части. Затем выполняется корректирующее обслуживание: устранение причины и возвращение системы в исправное состояние.</p><p>Восстановление включает ремонт или замену компонентов, восстановление данных и конфигурации из резервных копий, повторную настройку политик. Завершается проверкой того, что механизмы защиты работают, а защищаемая информация не пострадала. Работы документируются.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://pravo.ppt.ru/standart/134823\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ 18322-2016 «Система технического обслуживания и ремонта техники. Термины и определения»</a> — <a href=\"https://pravo.ppt.ru/standart/134823\" rel=\"noopener noreferrer\" target=\"_blank\">https://pravo.ppt.ru/standart/134823</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:36,title:"36. Правила обращения с разрешёнными съёмными носителями информации.",answer:"<strong>Ответ:</strong><p>Использовать можно только учтённые (зарегистрированные) носители, допущенные администратором: они вносятся в список разрешённых устройств по модели или серийному номеру. Остальные носители блокируются механизмом контроля устройств.</p><p>Правила: носитель имеет учётный номер и ответственного, категорию конфиденциальности (при полномочном управлении доступом), работа с ним регистрируется, при необходимости применяется теневое копирование записываемой информации; хранение — в установленных местах; ненужные данные удаляются гарантированно (затирание); утрата носителя расследуется.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Руководящий документ Гостехкомиссии России (1997) «Автоматизированные системы. Защита от несанкционированного доступа к информации. Классификация автоматизированных систем и требования по защите информации»</a> — <a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://ancud.ru/old/law/rdasnsd.pdf</a></div></div>"},
{num:37,title:"37. Основные методы организации технического обслуживания вычислительной техники и СЗИ.",answer:"<strong>Ответ:</strong><p>ГОСТ 18322-2016 различает методы: централизованный и децентрализованный; а также виды обслуживания: плановое (регламентное, периодическое), по техническому состоянию, корректирующее (после отказа). При централизованном методе обслуживание выполняет специализированная служба, при децентрализованном — силы подразделения-эксплуатанта.</p><p>Для вычислительной техники и СЗИ обычно сочетают плановое обслуживание по графику (проверки, обновления, копирование), обслуживание по состоянию (по результатам мониторинга) и корректирующее после отказов, фиксируя всё в эксплуатационных документах.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://pravo.ppt.ru/standart/134823\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ 18322-2016 «Система технического обслуживания и ремонта техники. Термины и определения»</a> — <a href=\"https://pravo.ppt.ru/standart/134823\" rel=\"noopener noreferrer\" target=\"_blank\">https://pravo.ppt.ru/standart/134823</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:38,title:"38. Политика доступа к конфиденциальным ресурсам и принцип минимальных привилегий.",answer:"<strong>Ответ:</strong><p>Политика доступа определяет, кто, к каким конфиденциальным ресурсам и с какими правами допускается, и реализуется сочетанием дискреционного и полномочного управления доступом: ресурсы получают категории, пользователи — допуски и конкретные права.</p><p>Принцип минимальных привилегий: каждому субъекту предоставляются только права, необходимые для выполнения служебных обязанностей, и только на нужное время. Права регулярно пересматриваются, при смене должности отзываются лишние, а все обращения к ресурсам регистрируются.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Руководящий документ Гостехкомиссии России (1997) «Автоматизированные системы. Защита от несанкционированного доступа к информации. Классификация автоматизированных систем и требования по защите информации»</a> — <a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://ancud.ru/old/law/rdasnsd.pdf</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:39,title:"39. Порядок ввода средств защиты в эксплуатацию и проверки их работоспособности.",answer:"<strong>Ответ:</strong><p>Ввод в эксплуатацию включает: завершение установки и настройки, проведение предварительных испытаний по программе и методике, опытную эксплуатацию, приёмочные испытания, оформление акта ввода в эксплуатацию и передачу эксплуатационных документов ответственным лицам.</p><p>Проверка работоспособности: вход и аутентификация, разграничение доступа к файлам и устройствам, работа контроля целостности и ЗПС, регистрация событий и тревог, связь клиентов с сервером, применение политик. Результаты заносятся в протоколы. Виды испытаний приведены в ГОСТ Р 59792-2021.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59792-2021 «Комплекс стандартов на автоматизированные системы. Виды испытаний автоматизированных систем»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html</a></div><div class=\"q-source-item\"><a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 51583-2014 «Защита информации. Порядок создания автоматизированных систем в защищенном исполнении. Общие положения»</a> — <a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">https://base.garant.ru/70795270/</a></div></div>"},
{num:40,title:"40. Организация учёта событий печати конфиденциальных документов.",answer:"<strong>Ответ:</strong><p>Учёт обеспечивается регистрацией каждого задания печати в журнале: кто (пользователь), когда, на каком принтере и с какого компьютера, что печатал (имя документа), сколько страниц, какой категории конфиденциальности документ. Дополнительно применяется маркировка распечаток и теневое копирование напечатанных документов.</p><p>Журнал печати защищается от изменения и периодически анализируется администратором безопасности, записи сверяются с учётными документами организации (журналы учёта документов). Хранение записей — в течение установленного срока.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59548-2022_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59548-2022 «Защита информации. Регистрация событий безопасности. Требования к регистрируемой информации»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59548-2022_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59548-2022_natsionalnyy_standart_rossiyskoy.html</a></div></div>"},
{num:41,title:"41. Технический паспорт защищаемой системы: описание состава, конфигурации и средств защиты.",answer:"<strong>Ответ:</strong><p>Паспорт включает описание состава системы: перечень технических средств (тип, номер, размещение), системное и прикладное ПО с версиями, схему сетевого взаимодействия, перечень защищаемых ресурсов и категорий информации.</p><p>Раздел о защите содержит: применяемые СЗИ (название, версия, сертификат), настройки основных механизмов (политики входа, контроль целостности, ЗПС, разрешённые устройства), ответственных лиц и порядок внесения изменений. Паспорт поддерживается актуальным и служит эталоном при контроле конфигурации.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ 34.201-2020 «Виды, комплектность и обозначение документов при создании автоматизированных систем»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html</a></div><div class=\"q-source-item\"><a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 51583-2014 «Защита информации. Порядок создания автоматизированных систем в защищенном исполнении. Общие положения»</a> — <a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">https://base.garant.ru/70795270/</a></div></div>"},
{num:42,title:"42. Порядок настройки и проверки доступа к устройствам.",answer:"<strong>Ответ:</strong><p>Порядок настройки: 1) провести инвентаризацию устройств, нужных для работы; 2) включить механизм контроля устройств и сформировать список устройств и групп; 3) назначить права пользователям и категории (при полномочном управлении); 4) задать реакцию на подключение, отключение и изменение; 5) включить регистрацию событий; 6) применить политику.</p><p>Проверка: подключить разрешённое и запрещённое устройство под тестовыми учётными записями, убедиться в блокировке или доступе согласно политике, проверить появление записей в журнале и срабатывание тревог, а также применение настроек на клиентах.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:43,title:"43. Разработка и ведение эксплуатационных документов защищённых автоматизированных систем.",answer:"<strong>Ответ:</strong><p>Разработка: определить перечень документов по ГОСТ 34.201-2020 и ТЗ, подготовить их с содержанием по ГОСТ Р 59795-2021, согласовать и утвердить. Для защищённых АС в перечень включают документы по защите (инструкции администратора безопасности и пользователей, порядок резервирования и восстановления, паспорт).</p><p>Ведение: присвоение учётных номеров, учёт и хранение подлинников и копий, регистрация изменений, регулярный пересмотр на соответствие фактической конфигурации, ознакомление персонала под роспись, исключение использования устаревших редакций.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ 34.201-2020 «Виды, комплектность и обозначение документов при создании автоматизированных систем»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost_gosudarstvennyj-standart/0/gost_34_201-2020_mezhgosudarstvennyy_standart.html</a></div><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59795-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59795-2021 «Комплекс стандартов на автоматизированные системы. Автоматизированные системы. Требования к содержанию документов»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59795-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59795-2021_natsionalnyy_standart_rossiyskoy.html</a></div></div>"},
{num:44,title:"44. Настройка регистрации событий для задач аудита безопасности.",answer:"<strong>Ответ:</strong><p>Настройка начинается с определения задач аудита: расследование инцидентов, контроль действий администраторов, контроль доступа к конфиденциальным данным. Затем выбираются события по подсистемам (вход, доступ к ресурсам, устройства, печать, ЗПС, контроль целостности, изменение политик) и их важность.</p><p>Задаются параметры журнала: размер, срок хранения, действие при переполнении, передача событий на сервер; выбираются события-тревоги для оперативного оповещения; настраиваются отчёты. Состав записи должен соответствовать ГОСТ Р 59548-2022. Затем проверяется, что события действительно регистрируются.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Централизованное управление, мониторинг и аудит»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59548-2022_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59548-2022 «Защита информации. Регистрация событий безопасности. Требования к регистрируемой информации»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59548-2022_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59548-2022_natsionalnyy_standart_rossiyskoy.html</a></div></div>"},
