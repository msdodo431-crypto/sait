{num:45,title:"45. Содержание акта ввода автоматизированной системы в эксплуатацию.",answer:"<strong>Ответ:</strong><p>Акт включает: реквизиты (наименование, дата, место), основание для составления, состав комиссии, сведения о системе и составе вводимых средств (в т.ч. средств защиты), перечень пройденных испытаний и их результаты, сведения о документации, переданной заказчику.</p><p>Также в акте указываются выявленные недостатки и сроки их устранения, заключение комиссии о готовности системы и о вводе в эксплуатацию, ответственные за эксплуатацию, подписи членов комиссии и представителей исполнителя и заказчика. Приложения — протоколы испытаний, перечни документов.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 51583-2014 «Защита информации. Порядок создания автоматизированных систем в защищенном исполнении. Общие положения»</a> — <a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">https://base.garant.ru/70795270/</a></div><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59792-2021 «Комплекс стандартов на автоматизированные системы. Виды испытаний автоматизированных систем»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html</a></div></div>"},
{num:46,title:"46. Методы проверки эффективности разграничения доступа.",answer:"<strong>Ответ:</strong><p>Основной метод — проверка соответствия реальных прав матрице доступа: для набора пользователей и ресурсов (файлы, каталоги, устройства, принтеры) проверяют, что разрешённые операции выполняются, а запрещённые блокируются. Проверяются как дискреционные права, так и метки конфиденциальности и контроль потоков.</p><p>Дополнительно: попытки несанкционированного доступа в рамках испытаний, анализ журналов (были ли зарегистрированы отказы), аудит назначенных прав на избыточность, проверка наследования прав и политик. Результаты оформляются протоколом. Виды испытаний определены ГОСТ Р 59792-2021.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Руководящий документ Гостехкомиссии России (1997) «Автоматизированные системы. Защита от несанкционированного доступа к информации. Классификация автоматизированных систем и требования по защите информации»</a> — <a href=\"https://ancud.ru/old/law/rdasnsd.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://ancud.ru/old/law/rdasnsd.pdf</a></div><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59792-2021 «Комплекс стандартов на автоматизированные системы. Виды испытаний автоматизированных систем»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/1/gost_r_59792-2021_natsionalnyy_standart_rossiyskoy.html</a></div></div>"},
{num:47,title:"47. Назначение концепции защиты автоматизированной системы и её основные положения.",answer:"<strong>Ответ:</strong><p>Концепция защиты — документ, который устанавливает цели защиты АС, принципы и подходы к её построению. Она нужна как основа для формирования требований безопасности, технического задания и проектирования системы защиты.</p><p>Основные положения: цели и задачи защиты, объекты защиты и категории информации, перечень актуальных угроз и модель нарушителя, принципы построения защиты (комплексность, разграничение полномочий, минимальные привилегии, регистрация и контроль), основные меры и средства защиты, распределение ответственности. Требования безопасности закладываются в ТЗ на стадии создания АС.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 51583-2014 «Защита информации. Порядок создания автоматизированных систем в защищенном исполнении. Общие положения»</a> — <a href=\"https://base.garant.ru/70795270/\" rel=\"noopener noreferrer\" target=\"_blank\">https://base.garant.ru/70795270/</a></div><div class=\"q-source-item\"><a href=\"https://base.garant.ru/403255670/\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ 34.602-2020 «Информационные технологии. Комплекс стандартов на автоматизированные системы. Техническое задание на создание автоматизированной системы»</a> — <a href=\"https://base.garant.ru/403255670/\" rel=\"noopener noreferrer\" target=\"_blank\">https://base.garant.ru/403255670/</a></div></div>"},
{num:48,title:"48. Действия администратора при обнаружении нарушения целостности защищаемых объектов.",answer:"<strong>Ответ:</strong><p>Порядок действий: 1) зафиксировать событие (объект, время, пользователь, компьютер) по журналу и тревоге; 2) установить, было ли изменение санкционировано (обновление, плановые работы); 3) если нет — изолировать компьютер (блокировка, отключение от сети) и сохранить доказательства.</p><p>4) проанализировать причину, проверить систему на вредоносное ПО и признаки НСД; 5) восстановить объект из эталона или резервной копии и проверить работоспособность; 6) при санкционированном изменении — пересчитать эталон; 7) доложить ответственному лицу, оформить результат расследования и принять меры по недопущению повторения.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Централизованное управление, мониторинг и аудит»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:49,title:"49. Комплексное применение механизмов СЗИ от НСД при эксплуатации автоматизированной системы.",answer:"<strong>Ответ:</strong><p>Механизмы СЗИ эффективны только в сочетании (эшелонированная защита): доверенная загрузка и аутентификация защищают вход; дискреционное и полномочное управление доступом — данные; ЗПС и контроль целостности — среду выполнения; контроль устройств и печати — каналы утечки; регистрация и аудит — контроль и расследование.</p><p>Централизованное управление обеспечивает единые политики и мониторинг, а организационные меры (документация, обучение, разделение ролей, техническое обслуживание) делают технические меры работоспособными. Класс защищённости АС по РД Гостехкомиссии определяет, какой набор механизмов обязателен.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Принципы построения»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div><div class=\"q-source-item\"><a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">Код Безопасности. Документация Secret Net Studio: «Руководство администратора. Настройка и эксплуатация. Локальная защита»</a> — <a href=\"https://www.securitycode.ru/products/secret-net-studio/documentation/\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.securitycode.ru/products/secret-net-studio/documentation/</a></div></div>"},
{num:50,title:"50. Порядок документирования отказов, восстановительных работ и результатов проверок.",answer:"<strong>Ответ:</strong><p>Каждый отказ фиксируется в журнале: дата и время, описание признаков, затронутый компонент, выявленная причина, принятые меры, исполнитель, время восстановления, результат проверки работоспособности. При серьёзных отказах составляется акт или отчёт, доводимый до ответственного лица.</p><p>Результаты проверок оформляются протоколами с указанием метода, объекта проверки, результата и заключения. Записи хранятся вместе с эксплуатационными документами и используются при актуализации паспорта, планировании обслуживания и анализе надёжности защиты.</p><div class=\"q-source\"><strong>Источники:</strong><div class=\"q-source-item\"><a href=\"https://pravo.ppt.ru/standart/134823\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ 18322-2016 «Система технического обслуживания и ремонта техники. Термины и определения»</a> — <a href=\"https://pravo.ppt.ru/standart/134823\" rel=\"noopener noreferrer\" target=\"_blank\">https://pravo.ppt.ru/standart/134823</a></div><div class=\"q-source-item\"><a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59795-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">ГОСТ Р 59795-2021 «Комплекс стандартов на автоматизированные системы. Автоматизированные системы. Требования к содержанию документов»</a> — <a href=\"https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59795-2021_natsionalnyy_standart_rossiyskoy.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://meganorm.ru/mega_doc/norm/gost-r_gosudarstvennyj-standart/9/gost_r_59795-2021_natsionalnyy_standart_rossiyskoy.html</a></div></div>"}
];

const questionsBox = document.getElementById("questions");
const result = document.getElementById("result");

function esc(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[ch]);
}

function showAnswer(item, button) {
  document.querySelectorAll(".question button").forEach(b => b.classList.remove("active"));
  if (button) button.classList.add("active");
  result.innerHTML = `
    <h2 class="result-question">${esc(item.title)}</h2>
    <div class="answer">${item.answer}</div>
  `;
}

questions.forEach((item) => {
  const wrapper = document.createElement("div");
  wrapper.className = "question";
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = item.title;
  button.addEventListener("click", () => showAnswer(item, button));
  wrapper.appendChild(button);
  questionsBox.appendChild(wrapper);
});
</script>
